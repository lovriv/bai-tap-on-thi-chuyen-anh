 {kind:'q', num:60, q:'What is the term for the transfer of pollen from ANTHER to STIGMA in flowers?', a:'Pollination', exp:'<b>Pollination</b> (thụ phấn): pollen (phấn hoa) chuyển từ <b>anther</b> (nhị, đực) đến <b>stigma</b> (nhụy, cái).<br><b>Tác nhân pollination:</b> wind (gió), insects (côn trùng — chủ yếu ong), birds, bats.<br><b>Sau pollination:</b> fertilization → tạo seed → mọc thành cây mới.', ref:'S.L11', pts:'0.1đ'},

 {kind:'section', text:'PART 3 — READING (Nature/Science theme)'},
 {kind:'subsection', text:'The Secret Language of Trees'},
 {kind:'passage', text:'<b>A.</b> For centuries, people have looked at forests and seen only individual trees, each one growing alone. But in the last twenty years, scientists have made a startling discovery: trees actually communicate with each other, and they share resources in ways that resemble a vast underground community.<br><br><b>B.</b> The key to this network lies hidden beneath the forest floor. The roots of nearby trees are connected by tiny fungal threads called mycorrhizae. These thin networks act like an internet — passing information, water, and nutrients between trees that may be hundreds of metres apart.<br><br><b>C.</b> Through this network, an older tree can recognise its own seedlings and send them extra sugar and minerals to help them grow. When one tree is attacked by insects, it can release chemical warnings through the fungal threads. Neighbouring trees then produce defensive chemicals before the attack even reaches them.<br><br><b>D.</b> The discovery has changed how scientists understand forests. A forest is no longer just a collection of trees competing for sunlight; it is a co-operative community where trees support each other through shared resources, warnings, and even mourning. When a tree dies, the surrounding trees often continue to send nutrients to its trunk for years.<br><br><b>E.</b> What we learn from forests applies to people too. We thrive not by competing alone, but by being connected to others — sharing knowledge, warning each other of danger, supporting the young. Perhaps the trees have been quietly teaching this lesson for millions of years; we are only just beginning to listen.'},
 {kind:'q', num:61, q:'In paragraph A, what was the old view about trees that scientists have now changed?', a:'That trees grow alone / are isolated', exp:'Para A: trước đây người ta thấy "individual trees, each one growing alone".', ref:'Reading R1', pts:'0.25đ'},
 {kind:'q', num:62, q:'In paragraph B, identify <b>one adjective</b> and <b>one verb</b>.', a:'Adj: tiny, fungal, thin · Verb: connected, act, passing', exp:'Có nhiều lựa chọn đúng.', ref:'Reading R2', pts:'0.25đ'},
 {kind:'q', num:63, q:'In paragraph C, the writer says trees can send "chemical warnings". Explain <b>in your own words</b> what this means.', a:'Trees release chemicals that signal other trees about danger', exp:'<b>Sample:</b> Trees release special chemicals through their roots that act as a warning message to other trees about insect attack.', ref:'Reading R7', pts:'0.25đ'},
 {kind:'q', num:64, q:'In paragraph D, why does the writer compare a forest to a "co-operative community"?',
  subq:'<div class="options"><p>A. Because trees compete fiercely for sunlight.</p><p>B. Because trees support each other through shared resources.</p><p>C. Because trees grow in straight lines like buildings.</p><p>D. Because trees are governed by laws.</p></div>',
  a:'B', exp:'Para D: trees "support each other through shared resources, warnings, and even mourning".', ref:'Reading R3', pts:'0.25đ'},
 {kind:'q', num:65, q:'Give a synonym for "startling" as used in paragraph A.', a:'surprising / shocking / amazing / unexpected', exp:'<b>Startling</b> = gây ngạc nhiên, bất ngờ.', ref:'Reading R4', pts:'0.25đ'},
 {kind:'q', num:66, q:'In paragraph E, explain <b>in your own words</b> what the writer thinks people can learn from trees.', a:'Câu mở', exp:'<b>Sample:</b> We grow stronger when we are connected to other people — sharing what we know, helping each other, and supporting the young — rather than trying to succeed alone.', ref:'Reading R6', pts:'0.25đ'},
 {kind:'q', num:67, q:'T/F/NG:<br>A. Trees can recognise their own seedlings.<br>B. All trees in a forest are the same species.', a:'A: TRUE — B: NOT GIVEN', exp:'A: Para C ✓. B: bài không nói về cùng loài hay không.', ref:'Reading R5', pts:'0.25đ'},
 {kind:'q', num:68, q:'T/F/NG:<br>A. Mycorrhizae are described in the text as fungal threads.<br>B. Vietnamese forests are studied the most in the world.', a:'A: TRUE — B: NOT GIVEN', exp:'A: Para B ✓. B: bài không đề cập Việt Nam.', ref:'Reading R5', pts:'0.25đ'},

 {kind:'section', text:'PART 4 — WRITING (Persuasive — Save Nature)'},
 {kind:'instruction', text:'Imagine your school is considering whether to plant a small tree garden in the courtyard. Some students worry it will take too much space. Write a proposal that argues FOR planting the tree garden. <b>Three paragraphs.</b><br>✦ Your idea / what the garden would look like.<br>✦ Why it would help students and the environment.<br>✦ How to address concerns about space.<br>Write <b>100-150 words</b>.'},
 {kind:'q', num:69, q:'Viết bài Writing. Bấm "Xem đáp án" để xem mẫu.', a:'Sample + Rubric',
  exp:'<b>Sample (~135 từ):</b><br><em>Our school should plant a small tree garden in the courtyard — even just five young trees, arranged around three wooden benches, would transform the space. A few native flowering trees, easy to maintain, would create a calm corner of greenery in the middle of busy concrete.<br><br>The benefits would be real. On hot days, the trees would offer shade where students could read, talk, or quietly relax between classes. The trees would also absorb carbon dioxide and noise, while supporting birds and insects. Science classes could even use the garden for live observation.<br><br>I understand some students worry about losing space, but the garden would actually take only a small section — about the size of two parked cars. The rest of the courtyard would stay open. We would gain a peaceful, healthier place to spend our break times, while teaching ourselves that nature deserves a home, even in school.</em>',
  ref:'Writing', pts:'2đ'}
]},

 {kind:'section', text:'PART 2 — SCIENCE (30 câu — cluster format theo đề thật)'},

 {kind:'instruction', text:'Use the following passage about gravity and weight to answer questions 31, 32, 33.'},
 {kind:'passage', text:'<b>Mass</b> measures the amount of matter in an object (in kilograms) — it stays the same anywhere in the universe. <b>Weight</b> is the force of gravity on the mass (in newtons): <b>W = m × g</b>. The gravitational field strength <b>g</b> differs between places: on Earth g = 10 N/kg, on the Moon g ≈ 1.6 N/kg, on Jupiter g ≈ 25 N/kg.'},
 {kind:'q', num:31, q:'On Earth, calculate the weight of a 65 kg person.', a:'650 N', exp:'W = 65 × 10 = <b>650 N</b>.', ref:'S.L13', pts:'0.1đ'},
 {kind:'q', num:32, q:'On the MOON, what is the weight of the same 65 kg person? (g = 1.6 N/kg)', a:'104 N', exp:'W = 65 × 1.6 = <b>104 N</b>. Mass không đổi nhưng weight giảm.', ref:'S.L13', pts:'0.1đ'},
 {kind:'q', num:33, q:'A person\'s mass stays the same on Moon and Earth. Which factor causes WEIGHT to differ?', a:'Gravitational field strength (g) / gravity', exp:'Mass = lượng vật chất (kg) — không đổi ở mọi nơi.<br>Weight = m × <b>g</b> (N) — phụ thuộc g.<br>Earth g = 10 N/kg · Moon g = 1.6 N/kg · Jupiter g ≈ 25 N/kg.<br>Cùng mass nhưng g khác → weight khác.', ref:'S.L13', pts:'0.1đ'},

 {kind:'q', num:34, q:'Name the 8 planets IN ORDER from the Sun.', a:'Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune', exp:'Mnemonic: My Very Educated Mother Just Served Us Noodles.', ref:'S.L13', pts:'0.1đ'},
 {kind:'q', num:35, q:'Which is the largest planet in our Solar System?', a:'Jupiter', exp:'Jupiter (Sao Mộc) — gas giant lớn nhất.', ref:'S.L13', pts:'0.1đ'},
 {kind:'q', num:36, q:'Jupiter has stronger gravity than Earth because it has more ___.', a:'Mass', exp:'Gravity tỉ lệ thuận với <b>mass</b>. Jupiter có mass gấp ~318 lần Earth → g lớn hơn ~2.5×.<br>Càng nhiều mass → càng kéo các vật mạnh hơn.<br>Mặt Trời (mass cực lớn) → giữ cả 8 planets quay quanh.', ref:'S.L13', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about polymers to answer questions 37, 38, 39.'},
 {kind:'passage', text:'A <b>polymer</b> is a long chain molecule made of many small repeating units (monomers). Polymers fall into two main types: <b>thermoplastics</b> (e.g. polythene, PET) can be heated, melted, and reshaped many times. <b>Thermosetting polymers</b> (e.g. Bakelite, epoxy resin) harden permanently when first heated and CANNOT be melted again. Polymers are widely used because they are light, cheap, waterproof, and strong — but most do not biodegrade for hundreds of years.'},
 {kind:'q', num:37, q:'What is a polymer made from?', a:'Many small repeating units called MONOMERS', exp:'Polymer = nhiều monomer lặp lại.', ref:'S.L14', pts:'0.1đ'},
 {kind:'q', num:38, q:'State ONE difference between thermoplastic and thermosetting polymers.', a:'Thermoplastic: can be melted and reshaped. Thermosetting: hardens permanently — cannot melt again.', exp:'Theo bài.', ref:'S.L14', pts:'0.1đ'},
 {kind:'q', num:39, q:'How many YEARS can most plastic polymers take to biodegrade in landfills?', a:'Hundreds of years', exp:'Most plastics (polythene, PET, PVC) cần <b>hàng trăm năm</b> để phân huỷ. Tích tụ rác trong đất, đại dương → vi nhựa (microplastics) → vào chuỗi thức ăn → vào cơ thể người.<br><b>Giải pháp:</b> 3R — Reduce, Reuse, Recycle. Dùng bioplastics (từ tinh bột, sinh khối).', ref:'S.L14', pts:'0.1đ'},

 {kind:'instruction', text:'A student sorts these everyday objects: a plastic water bottle, a clay flowerpot, a Bakelite light switch, a glass window. (Questions 40, 41, 42)'},
 {kind:'q', num:40, q:'Which two are POLYMERS?', a:'Plastic water bottle (PET) AND Bakelite light switch', exp:'PET = thermoplastic; Bakelite = thermosetting.', ref:'S.L14', pts:'0.1đ'},
 {kind:'q', num:41, q:'Which two are CERAMICS (or ceramic-like)?', a:'Clay flowerpot AND glass window', exp:'Cả 2 đều cứng, giòn, làm từ silicate.', ref:'S.L14', pts:'0.1đ'},
 {kind:'q', num:42, q:'State ONE useful property of ceramics.', a:'Any: heat-resistant, hard, electrical insulator, chemically stable', exp:'Ceramic: tốt nhiều mặt.', ref:'S.L14', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about acids and bases to answer questions 43, 44, 45.'},
 {kind:'passage', text:'Acids have a pH less than 7 and taste sour. Common acids: hydrochloric acid (stomach), citric acid (lemons), ethanoic acid (vinegar). Bases have pH greater than 7 — a base that dissolves in water is called an <b>alkali</b>. When an acid reacts with a base, <b>neutralisation</b> occurs: <b>acid + base → salt + water</b>. The pH scale runs from 0 (strong acid) to 14 (strong alkali), with 7 = neutral.'},
 {kind:'q', num:43, q:'What is the pH of a NEUTRAL solution?', a:'7', exp:'pH 7 = trung tính.', ref:'S.L15', pts:'0.1đ'},
 {kind:'q', num:44, q:'Complete: acid + base → ___ + ___', a:'salt + water', exp:'Phản ứng trung hoà.', ref:'S.L15', pts:'0.1đ'},
 {kind:'q', num:45, q:'What is the difference between a BASE and an ALKALI?', a:'A base is any substance that neutralises acid; an alkali is a base that DISSOLVES IN WATER', exp:'Mọi alkali là base; nhưng base không tan trong nước thì không phải alkali.', ref:'S.L15', pts:'0.1đ'},

s-serif" font-size="10">Purple</text><text x="540" y="100" text-anchor="middle" font-family="sans-serif" font-size="10">Dark P.</text><text x="60" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">Strong</text><text x="60" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">ACID</text><text x="300" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a" font-weight="bold">NEUTRAL</text><text x="540" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed" font-weight="bold">Strong</text><text x="540" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c3aed" font-weight="bold">ALKALI</text><text x="20" y="170" font-family="sans-serif" font-size="10" font-style="italic">Examples: lemon juice (pH 2), milk (pH 6), water (7), soap (10), bleach (13)</text></svg>'},

 {kind:'section', text:'PART 3 — READING (Mysteries / Science theme)'},
 {kind:'subsection', text:'The Disappearing Lake of Vietnam'},
 {kind:'passage', text:'<b>A.</b> Deep in the limestone mountains of Quảng Bình province lies one of the strangest natural mysteries in Vietnam. For most of the year, Sông Chày is a calm, ordinary river. But every July, something extraordinary happens: a section of the river simply vanishes, swallowed beneath the earth in a matter of days, leaving behind only dry stone and curious villagers.<br><br><b>B.</b> Local people have known about the disappearing river for centuries. Some explained it through ancient legends — angry spirits, or dragons that swallowed the water. But the explanation, scientists now believe, lies in a remarkable geological feature beneath the surface: a vast network of underground caves and channels carved through the soft limestone over millions of years.<br><br><b>C.</b> When the monsoon rains arrive, water levels rise across the region. The hidden channels become blocked by debris, or the pressure of water elsewhere forces it to take a different path. For several weeks, the surface river runs dry while the same water continues to flow, hidden, beneath the rocks. By autumn, the channels clear, and the river slowly returns.<br><br><b>D.</b> The mystery is not just scientific but cultural. Each year, when the river disappears, families come to the dry riverbed to look for ancient pottery and coins that the river has uncovered. Some pieces date back hundreds of years — silent reminders that the river has been performing this strange seasonal dance for generations.<br><br><b>E.</b> Today, geologists from Vietnam and other countries continue to study Sông Chày. They map the underground channels using sensitive instruments and dive into the deeper caves. Some mysteries take decades to fully solve. But the river itself does not seem to mind — it simply keeps disappearing, year after year, doing what it has always done.'},
 {kind:'q', num:61, q:'In paragraph A, in which month does the river disappear each year?', a:'July', exp:'Para A: "every July".', ref:'Reading R1', pts:'0.25đ'},
 {kind:'q', num:62, q:'In paragraph B, identify <b>one adjective</b> and <b>one verb</b>.', a:'Adj: ancient, vast, soft, hidden · Verb: known, explained, carved, swallowed', exp:'Nhiều lựa chọn đúng.', ref:'Reading R2', pts:'0.25đ'},
 {kind:'q', num:63, q:'In paragraph A, the writer says the disappearance is "extraordinary". Explain <b>in your own words</b> what "extraordinary" means.', a:'Very unusual / amazing / not normal', exp:'<b>Extraordinary</b> = phi thường, khác thường.', ref:'Reading R7', pts:'0.25đ'},
 {kind:'q', num:64, q:'In paragraph B, why does the writer mention old legends about dragons?',
  subq:'<div class="options"><p>A. To prove dragons really existed.</p><p>B. To show how people once tried to explain the mystery.</p><p>C. To explain how rivers are formed.</p><p>D. To frighten visitors away.</p></div>',
  a:'B', exp:'Para B: legends là cách giải thích cổ trước khi khoa học biết về underground channels.', ref:'Reading R3', pts:'0.25đ'},
 {kind:'q', num:65, q:'Give a synonym for "hidden" as used in paragraph B.', a:'concealed / unseen / invisible / secret', exp:'<b>Hidden</b> = giấu kín, không thấy.', ref:'Reading R4', pts:'0.25đ'},
 {kind:'q', num:66, q:'In paragraph D, explain <b>in your own words</b> what villagers find when the river disappears.', a:'Câu mở', exp:'<b>Sample:</b> When the river dries, villagers walk on the riverbed and look for old pottery and coins from hundreds of years ago, which the river had hidden under water.', ref:'Reading R6', pts:'0.25đ'},
 {kind:'q', num:67, q:'T/F/NG:<br>A. The river is in northern Vietnam.<br>B. The disappearance is connected to underground caves.', a:'A: FALSE — B: TRUE', exp:'A: Para A "Quảng Bình province" — miền Trung, không phải Bắc. B: Para B ✓.', ref:'Reading R5', pts:'0.25đ'},
 {kind:'q', num:68, q:'T/F/NG:<br>A. Scientists understand every part of the mystery.<br>B. Some items found in the dry riverbed are hundreds of years old.', a:'A: NOT GIVEN — B: TRUE', exp:'A: Para E "decades to fully solve" — chưa rõ. B: Para D "date back hundreds of years" ✓.', ref:'Reading R5', pts:'0.25đ'},

 {kind:'instruction', text:'Imagine your school is considering whether to introduce a "No Phones During Class" policy. Some students support it; others disagree. Write a proposal arguing your view. <b>Three paragraphs.</b><br>✦ State your position clearly (for OR against).<br>✦ Give 2 reasons supporting your view.<br>✦ Respond to those who disagree.<br>Write <b>100-150 words</b>.'},
 {kind:'q', num:69, q:'Viết bài Writing. Bấm "Xem đáp án" để xem mẫu.', a:'Sample + Rubric',
  exp:'<b>Sample (~130 từ) — Arguing FOR a no-phones policy:</b><br><em>I strongly support a "No Phones During Class" policy at our school. Mobile phones, while useful outside lessons, distract students and reduce real learning during class time.<br><br>First, phones break focus. Notifications, messages, and the temptation to check social media constantly pull students\' attention away from teachers. Research shows that even a phone face-down on a desk reduces concentration. Second, phones can replace healthy social interaction. Without phones, students talk more in breaks, work better in groups, and feel more present.<br><br>I understand some classmates worry about emergencies, but phones could still be kept in bags and used during break times or in the school office for urgent calls. Teachers could also allow phones for specific lesson activities. A balanced policy protects learning without cutting students off from the world.</em>',
  ref:'Writing — Argue & Persuade', pts:'2đ'}
]},
{n:7, type:'mix', title:'Day 7 — Math L17-19 + Science L16-18', time:'~90-120 phút · 60 câu', focus:'Math: Transformations 1 & 2, Angles & Constructions. Science: Nutrition & Digestion, Circulation, Body Problems.', items:[
 {kind:'section', text:'PART 1 — MATHEMATICS (30 câu)'},
 {kind:'subsection', text:'M.L17 — Transformations 1 (8 câu)'},
 {kind:'q', num:1, q:'Reflect the point (3, 4) in the x-axis. Give the new coordinates.', a:'(3, −4)', exp:'Reflection in x-axis: y → −y → <b>(3, −4)</b>.', ref:'M.L17', pts:'0.05đ'},
 {kind:'q', num:2, q:'Reflect the point (3, 4) in the y-axis.', a:'(−3, 4)', exp:'Reflection in y-axis: x → −x → <b>(−3, 4)</b>.', ref:'M.L17', pts:'0.05đ'},
 {kind:'q', num:3, q:'Translate point (2, 5) by the vector (3, −2). New position?', a:'(5, 3)', exp:'(2+3, 5+(−2)) = <b>(5, 3)</b>.', ref:'M.L17', pts:'0.05đ'},
 {kind:'q', num:4, q:'Rotate the point (1, 0) by 90° anticlockwise about the origin.', a:'(0, 1)', exp:'90° anticlockwise: (x, y) → (−y, x) → (0, 1).', ref:'M.L17', pts:'0.05đ'},
 {kind:'q', num:5, q:'Rotate (4, 3) by 180° about the origin.', a:'(−4, −3)', exp:'180°: (x, y) → (−x, −y) → <b>(−4, −3)</b>.', ref:'M.L17', pts:'0.05đ'},
 {kind:'q', num:6, q:'Reflect (5, −2) in the line y = x.', a:'(−2, 5)', exp:'Reflection in y = x: (x, y) → (y, x) → <b>(−2, 5)</b>.', ref:'M.L17', pts:'0.05đ'},
 {kind:'q', num:7, q:'Translate by vector (−4, 5): the point (7, 1) goes to ___.', a:'(3, 6)', exp:'(7−4, 1+5) = <b>(3, 6)</b>.', ref:'M.L17', pts:'0.05đ'},
 {kind:'q', num:8, q:'Name 4 types of transformations.', a:'Reflection, rotation, translation, enlargement', exp:'4 phép biến đổi cơ bản.', ref:'M.L17', pts:'0.05đ'},

 {kind:'subsection', text:'M.L18 — Transformations 2 (Enlargements) (8 câu)'},
 {kind:'q', num:9, q:'A square has sides 6 cm. Enlarge by scale factor 2. Find the new side length.', a:'12 cm', exp:'6 × 2 = <b>12 cm</b>.', ref:'M.L18', pts:'0.05đ'},
 {kind:'q', num:10, q:'A square sides 6 cm enlarged by scale factor 2. Find the new AREA.', a:'144 cm²', exp:'Scale factor area = 2² = 4. New area = 36 × 4 = <b>144 cm²</b>.', ref:'M.L18', pts:'0.05đ'},
 {kind:'q', num:11, q:'If a shape is enlarged by scale factor 3, by what factor does the area increase?', a:'×9', exp:'Area sf = (linear sf)² = 3² = <b>9</b>.', ref:'M.L18', pts:'0.05đ'},
 {kind:'q', num:12, q:'A cube has edges 2 cm. Enlarge by scale factor 3. Find the new VOLUME.', a:'216 cm³', exp:'Volume sf = 3³ = 27. New V = 8 × 27 = <b>216 cm³</b>.', ref:'M.L18', pts:'0.05đ'},
 {kind:'q', num:13, q:'Triangle with vertices (0,0), (2,0), (0,3). Enlarge by SF 2 from origin. New vertices?', a:'(0,0), (4,0), (0,6)', exp:'Nhân tọa độ với 2 (vì tâm là origin).', ref:'M.L18', pts:'0.05đ'},
 {kind:'q', num:14, q:'A shape enlarged by SF 0.5 — does it get bigger or smaller?', a:'Smaller (half size)', exp:'SF < 1 → kích thước giảm.', ref:'M.L18', pts:'0.05đ'},
 {kind:'q', num:15, q:'A circle of radius 5 cm is enlarged by SF 4. New radius?', a:'20 cm', exp:'5 × 4 = <b>20 cm</b>.', ref:'M.L18', pts:'0.05đ'},
 {kind:'q', num:16, q:'Original area 25 cm². After enlargement, area is 225 cm². Find the linear scale factor.', a:'3', exp:'Area sf = 225/25 = 9 → linear sf = √9 = <b>3</b>.', ref:'M.L18', pts:'0.05đ'},

 {kind:'subsection', text:'M.L19 — Angles & Constructions (14 câu)'},
 {kind:'q', num:17, q:'Sum of interior angles in a triangle?', a:'180°', exp:'Tổng = <b>180°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:18, q:'Sum of interior angles in a quadrilateral?', a:'360°', exp:'Tổng = <b>360°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:19, q:'Two angles in a triangle are 65° and 85°. Find the third.', a:'30°', exp:'180 − 65 − 85 = <b>30°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:20, q:'Three angles in a quadrilateral are 90°, 110°, 80°. Find the fourth.', a:'80°', exp:'360 − 90 − 110 − 80 = <b>80°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:21, q:'Sum of interior angles of a pentagon (5 sides)?', a:'540°', exp:'(n − 2) × 180° = (5 − 2) × 180° = <b>540°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:22, q:'Sum of interior angles of a hexagon (6 sides)?', a:'720°', exp:'(6 − 2) × 180° = <b>720°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:23, q:'Each interior angle of a regular hexagon?', a:'120°', exp:'720° ÷ 6 = <b>120°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:24, q:'Two parallel lines crossed by a transversal — what is the relationship between alternate angles?', a:'They are equal', exp:'Alternate angles (so le) <b>bằng nhau</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:25, q:'Co-interior angles (same side of transversal) between parallel lines — sum?', a:'180°', exp:'Co-interior angles cộng = <b>180°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:26, q:'An exterior angle of a triangle is equal to the sum of which two interior angles?', a:'The two opposite (non-adjacent) interior angles', exp:'Exterior angle = sum of 2 góc trong đối diện.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:27, q:'A pair of angles add to 90°. They are called?', a:'Complementary angles', exp:'<b>Complementary</b> = bù 90°.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:28, q:'A pair of angles add to 180°. They are called?', a:'Supplementary angles', exp:'<b>Supplementary</b> = bù 180°.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:29, q:'Each interior angle of a regular pentagon?', a:'108°', exp:'540° ÷ 5 = <b>108°</b>.', ref:'M.L19', pts:'0.05đ'},
 {kind:'q', num:30, q:'A right angle is how many degrees?', a:'90°', exp:'<b>90°</b>.', ref:'M.L19', pts:'0.05đ'},

 {kind:'section', text:'PART 2 — SCIENCE (30 câu — cluster format theo đề thật)'},

 {kind:'instruction', text:'Use the following passage about a balanced diet to answer questions 31, 32, 33.'},
 {kind:'passage', text:'A balanced diet contains the right amounts of seven food groups: <b>carbohydrates</b> (energy), <b>proteins</b> (growth and repair), <b>fats</b> (energy store + insulation), <b>vitamins</b> (small but vital), <b>minerals</b> (e.g. calcium, iron), <b>water</b>, and <b>fibre</b> (helps digestion). A diet missing any of these can cause health problems — for example, lack of vitamin C causes scurvy, and lack of iron causes anaemia.'},
 {kind:'q', num:31, q:'Name the main function of CARBOHYDRATES in the body.', a:'Provide energy', exp:'Theo bài.', ref:'S.L16', pts:'0.1đ'},
 {kind:'q', num:32, q:'Name the main function of PROTEINS.', a:'Growth and repair of body tissues', exp:'Theo bài.', ref:'S.L16', pts:'0.1đ'},
 {kind:'q', num:33, q:'Name TWO benefits of fibre in the diet.', a:'Helps digestion AND prevents constipation', exp:'Theo bài + kiến thức bổ sung.', ref:'S.L16', pts:'0.1đ'},

 {kind:'instruction', text:'Figure 1 shows the human digestive system: mouth → oesophagus → stomach → small intestine → large intestine → anus. (Questions 34, 35, 36)'},
 {kind:'figure', text:'<svg viewBox="0 0 400 480" style="max-width:400px"><ellipse cx="200" cy="45" rx="50" ry="30" fill="#fef3c7" stroke="#000" stroke-width="2"/><text x="200" y="50" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Mouth</text><text x="265" y="50" font-family="sans-serif" font-size="10" fill="#16a34a">amylase</text><rect x="190" y="75" width="20" height="80" fill="#fde047" stroke="#000"/><text x="270" y="120" font-family="sans-serif" font-size="11">Oesophagus</text><ellipse cx="170" cy="190" rx="55" ry="40" fill="#fca5a5" stroke="#000" stroke-width="2"/><text x="170" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Stomach</text><text x="245" y="190" font-family="sans-serif" font-size="10" fill="#dc2626">HCl +</text><text x="245" y="202" font-family="sans-serif" font-size="10" fill="#dc2626">protease</text><path d="M 180 230 Q 90 260 100 320 Q 110 380 200 360 Q 290 340 250 290 Q 220 250 200 260" fill="#fef9c3" stroke="#000" stroke-width="2"/><text x="180" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Small intestine</text><text x="180" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">(most digestion + absorption)</text><rect x="80" y="380" width="240" height="50" fill="#d9f99d" stroke="#000" stroke-width="2" rx="20"/><text x="200" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Large intestine</text><text x="200" y="418" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">(water absorption)</text><rect x="190" y="430" width="20" height="30" fill="#fca5a5" stroke="#000"/><text x="250" y="450" font-family="sans-serif" font-size="11">Anus (egestion)</text><text x="10" y="473" font-family="sans-serif" font-size="10" font-style="italic" fill="#666">Stages: Ingestion → Digestion → Absorption → Egestion</text></svg>'},
 {kind:'q', num:34, q:'Name the enzyme in saliva that digests STARCH.', a:'Amylase', exp:'Amylase trong nước bọt bẻ tinh bột thành đường maltose.', ref:'S.L16', pts:'0.1đ'},
 {kind:'q', num:35, q:'Where does MOST digestion of food (and absorption of nutrients) take place?', a:'Small intestine', exp:'Ruột non = nơi chính.', ref:'S.L16', pts:'0.1đ'},
 {kind:'q', num:36, q:'What is the main role of the LARGE intestine?', a:'Absorbs water from undigested food', exp:'Hấp thụ nước → tạo phân rắn.', ref:'S.L16', pts:'0.1đ'},

 {kind:'instruction', text:'Figure 2 shows a single villus in the small intestine — finger-like, with a thin wall, a network of capillaries inside, and a tube called a lacteal. (Questions 37, 38)'},
 {kind:'figure', text:'<svg viewBox="0 0 420 300" style="max-width:420px"><text x="210" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">A single VILLUS (finger-like projection in small intestine)</text><rect x="20" y="240" width="380" height="40" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="50" y="265" font-family="sans-serif" font-size="11" font-style="italic">Intestine wall</text><path d="M 150 240 Q 130 100 210 60 Q 290 100 270 240 Z" fill="#fed7aa" stroke="#a16207" stroke-width="2"/><text x="120" y="120" font-family="sans-serif" font-size="10" fill="#a16207">Thin outer wall</text><text x="120" y="133" font-family="sans-serif" font-size="10" fill="#a16207">(1 cell thick)</text><path d="M 165 240 Q 160 180 200 130 Q 240 180 255 240 Z" fill="none" stroke="#dc2626" stroke-width="2"/><text x="210" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">Blood</text><text x="210" y="208" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">capillaries</text><ellipse cx="210" cy="170" rx="6" ry="40" fill="#facc15" stroke="#a16207"/><text x="230" y="170" font-family="sans-serif" font-size="11" fill="#a16207" font-weight="bold">Lacteal</text><text x="230" y="183" font-family="sans-serif" font-size="9" fill="#a16207">(lymph)</text><text x="305" y="170" font-family="sans-serif" font-size="10" fill="#dc2626">→ Glucose,</text><text x="305" y="183" font-family="sans-serif" font-size="10" fill="#dc2626">amino acids</text><text x="305" y="220" font-family="sans-serif" font-size="10" fill="#a16207">→ Fats</text><text x="20" y="295" font-family="sans-serif" font-size="10" font-style="italic" fill="#666">Finger shape → HUGE surface area for absorption. Thin wall → short diffusion distance.</text></svg>'},
 {kind:'q', num:37, q:'Finger-shape of villi INCREASES which important property of the small intestine?', a:'Surface area (for absorption)', exp:'Villi hình ngón tay → diện tích bề mặt ruột non tăng ~600 lần (tới 250 m²). Trên mỗi villus còn có <b>microvilli</b> → tổng diện tích ~30 m² → hấp thụ chất dinh dưỡng cực hiệu quả.<br>Đây cũng là nguyên tắc của alveoli (phổi), gills (mang cá) — surface area lớn cho exchange.', ref:'S.L16', pts:'0.1đ'},
 {kind:'q', num:38, q:'Thin villus wall (1 cell thick) provides what advantage?', a:'Short diffusion distance (faster absorption)', exp:'Vách mỏng 1 tế bào → <b>quãng đường khuếch tán ngắn</b> → nutrients (glucose, amino acids) đi từ ruột vào máu nhanh.<br>Đây là nguyên tắc chung của mọi bề mặt trao đổi: alveoli phổi, capillaries — thành cũng chỉ 1 cell thick.', ref:'S.L16', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about the human heart to answer questions 39, 40, 41.'},
 {kind:'passage', text:'The human heart has FOUR chambers: two upper chambers called <b>atria</b> (left and right), and two lower chambers called <b>ventricles</b>. The right side pumps deoxygenated blood to the LUNGS for gas exchange. The left side pumps oxygen-rich blood to the rest of the body. The <b>aorta</b> is the largest artery, carrying oxygen-rich blood from the left ventricle to the body. Valves between chambers stop blood from flowing backwards.'},
 {kind:'q', num:39, q:'How many chambers does the human heart have?', a:'4 (2 atria + 2 ventricles)', exp:'Theo bài.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:40, q:'Where does the RIGHT side of the heart pump blood to?', a:'The lungs (for gas exchange)', exp:'Right → phổi.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:41, q:'What is the name of the largest artery in the body?', a:'Aorta', exp:'Aorta = động mạch chủ.', ref:'S.L17', pts:'0.1đ'},

 {kind:'instruction', text:'Figure 3 shows the three types of blood vessel. (Questions 42, 43, 44)'},
 {kind:'figure', text:'<svg viewBox="0 0 540 250" style="max-width:540px"><text x="270" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Cross-sections of Blood Vessels</text><circle cx="90" cy="120" r="60" fill="#fecaca" stroke="#dc2626" stroke-width="14"/><circle cx="90" cy="120" r="25" fill="#fff"/><text x="90" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">ARTERY</text><text x="90" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">small lumen</text><text x="90" y="195" text-anchor="middle" font-family="sans-serif" font-size="10">Thick muscular wall</text><text x="90" y="208" text-anchor="middle" font-family="sans-serif" font-size="10">HIGH pressure</text><text x="90" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">Heart → Body</text><circle cx="270" cy="120" r="60" fill="#bfdbfe" stroke="#2563eb" stroke-width="6"/><circle cx="270" cy="120" r="50" fill="#fff"/><line x1="220" y1="120" x2="245" y2="105" stroke="#2563eb" stroke-width="2"/><line x1="295" y1="105" x2="320" y2="120" stroke="#2563eb" stroke-width="2"/><line x1="220" y1="120" x2="245" y2="135" stroke="#2563eb" stroke-width="2"/><line x1="295" y1="135" x2="320" y2="120" stroke="#2563eb" stroke-width="2"/><text x="270" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">VEIN</text><text x="270" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666">large lumen + valves</text><text x="270" y="195" text-anchor="middle" font-family="sans-serif" font-size="10">Thinner wall + valves</text><text x="270" y="208" text-anchor="middle" font-family="sans-serif" font-size="10">LOW pressure</text><text x="270" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">Body → Heart</text><circle cx="450" cy="120" r="20" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><circle cx="450" cy="120" r="15" fill="#fff"/><text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a16207">CAPILLARY</text><text x="450" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666">tiny</text><text x="450" y="170" text-anchor="middle" font-family="sans-serif" font-size="10">Wall = 1 cell thick</text><text x="450" y="183" text-anchor="middle" font-family="sans-serif" font-size="10">EXCHANGE site</text><text x="450" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">O₂, glucose, CO₂</text></svg>'},
 {kind:'q', num:42, q:'What is the function of ARTERIES?', a:'Carry blood AWAY from the heart (under high pressure)', exp:'Arteries dày, áp suất cao.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:43, q:'Valves in veins PREVENT what?', a:'Backflow of blood', exp:'Tĩnh mạch (veins) áp suất thấp, máu dễ chảy ngược. <b>Valves</b> (van) một chiều: chỉ cho máu đi VỀ tim, chặn chảy ngược.<br>Cơ chân co bóp giúp đẩy máu lên qua các van. Bệnh giãn tĩnh mạch xảy ra khi van hỏng.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:44, q:'Thin capillary walls (1 cell thick) allow which process between blood and body cells?', a:'Diffusion (exchange of gases and nutrients)', exp:'Capillaries thành 1 cell → nhanh chóng <b>diffusion</b>: O₂ + glucose từ máu → mô; CO₂ + chất thải từ mô → máu.<br>Đây là nơi TRAO ĐỔI chính trong cơ thể. Capillaries có ở khắp mọi mô.', ref:'S.L17', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about blood cells to answer questions 45, 46, 47.'},
 {kind:'passage', text:'Blood contains different cells. <b>Red blood cells</b> carry oxygen — they contain a protein called haemoglobin and have no nucleus, leaving more space for haemoglobin. <b>White blood cells</b> fight infection. <b>Platelets</b> help blood to clot when you cut yourself. <b>Plasma</b> is the liquid part of blood that carries dissolved nutrients, CO₂, hormones, and antibodies.'},
 {kind:'q', num:45, q:'What is the main function of RED blood cells?', a:'Carry oxygen (from lungs to body cells)', exp:'Chứa haemoglobin → mang O₂.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:46, q:'What do PLATELETS do?', a:'Help blood to clot (stop bleeding)', exp:'Đông máu khi bị thương.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:47, q:'Name TWO substances carried by plasma.', a:'Any 2 of: nutrients (glucose, amino acids), CO₂, hormones, antibodies, urea', exp:'Plasma = highway vận chuyển.', ref:'S.L17', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about lifestyle and health to answer questions 48, 49, 50.'},
 {kind:'passage', text:'Lifestyle choices have a big impact on health. <b>Smoking</b> damages the lungs and can cause lung cancer, bronchitis, and heart disease. <b>Too much sugar</b> can cause tooth decay, obesity, and type 2 diabetes. <b>Too much salt</b> raises blood pressure, increasing the risk of stroke. <b>Excess alcohol</b> damages the liver and brain. <b>Regular exercise</b>, on the other hand, strengthens the heart, builds bones and muscles, and improves mood.'},
 {kind:'q', num:48, q:'Name ONE disease caused by smoking that affects the lungs.', a:'Any: lung cancer, bronchitis, emphysema, COPD', exp:'Smoking gây bệnh phổi.', ref:'S.L18', pts:'0.1đ'},
 {kind:'q', num:49, q:'Eating too much salt RAISES which body measurement (increasing stroke risk)?', a:'Blood pressure', exp:'Salt (NaCl) giữ nước trong máu → thể tích máu tăng → <b>blood pressure</b> tăng → áp lực lên động mạch → nguy cơ stroke, heart attack.<br><b>Khuyến cáo WHO:</b> &lt;5g muối/ngày (~1 muỗng cà phê). Đa số người Việt ăn 9-12g/ngày.', ref:'S.L18', pts:'0.1đ'},
 {kind:'q', num:50, q:'Name TWO benefits of regular exercise.', a:'Any 2 of: stronger heart, stronger bones/muscles, healthier weight, better mood, better sleep', exp:'Theo bài + kiến thức.', ref:'S.L18', pts:'0.1đ'},

 {kind:'instruction', text:'A 16-year-old has been sleeping only 5 hours per night for several months and feels tired in class. (Questions 51, 52)'},
 {kind:'q', num:51, q:'How many hours of sleep are recommended per night for a teenager?', a:'8-10 hours', exp:'Teen cần 8-10 giờ.', ref:'S.L18', pts:'0.1đ'},
 {kind:'q', num:52, q:'Name TWO effects of long-term sleep deprivation on a teenager.', a:'Any 2: poor concentration, low mood, weaker immune system, slower growth, hormonal issues', exp:'Thiếu ngủ ảnh hưởng nhiều mặt.', ref:'S.L18', pts:'0.1đ'},

 {kind:'instruction', text:'Use the formula BMI = mass(kg) ÷ height(m)². A man is 1.75 m tall and weighs 85 kg. (Questions 53, 54)'},
 {kind:'q', num:53, q:'Calculate the man\'s BMI to 1 decimal place.', a:'27.8', exp:'BMI = 85 / (1.75)² = 85 / 3.0625 = <b>27.8</b>.', ref:'S.L18', pts:'0.1đ'},
 {kind:'q', num:54, q:'Healthy BMI range is 18.5-24.9. What does this man\'s BMI suggest?', a:'Overweight (BMI 25-30 is overweight)', exp:'BMI 27.8 → overweight.', ref:'S.L18', pts:'0.1đ'},

 {kind:'instruction', text:'(Questions 55-60) Mixed single questions on body health.'},
 {kind:'q', num:55, q:'Where in the body does GAS EXCHANGE (O₂ in, CO₂ out) take place?', a:'In the lungs — specifically in the alveoli', exp:'Alveoli = nơi trao đổi khí.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:56, q:'Name ONE benefit of fibre in the diet.', a:'Helps digestion / prevents constipation', exp:'Chất xơ.', ref:'S.L16', pts:'0.1đ'},
 {kind:'q', num:57, q:'What organ does excessive alcohol DIRECTLY damage?', a:'Liver', exp:'Gan = nơi chuyển hoá rượu.', ref:'S.L18', pts:'0.1đ'},
 {kind:'q', num:58, q:'Name ONE major disease caused by eating too much sugar.', a:'Type 2 diabetes (or tooth decay / obesity)', exp:'Đường nhiều → 3 vấn đề chính:<br>• <b>Tooth decay</b> (sâu răng): vi khuẩn ăn đường → tạo acid → ăn mòn men răng.<br>• <b>Obesity</b> (béo phì): calo thừa → tích trữ thành mỡ.<br>• <b>Type 2 diabetes</b> (tiểu đường): cơ thể giảm phản ứng với insulin → đường máu cao.', ref:'S.L18', pts:'0.1đ'},
 {kind:'q', num:59, q:'Name the smallest type of blood vessel.', a:'Capillaries', exp:'Mao mạch — thành mỏng 1 tế bào.', ref:'S.L17', pts:'0.1đ'},
 {kind:'q', num:60, q:'Name one food group that provides VITAMINS in the diet.', a:'Fruits and/or vegetables', exp:'Trái cây và rau xanh.', ref:'S.L16', pts:'0.1đ'},

 {kind:'section', text:'PART 3 — READING (Health/Body theme)'},
 {kind:'subsection', text:'The Heart That Beats Three Billion Times'},
 {kind:'passage', text:'<b>A.</b> Inside your chest, hidden behind a thin layer of bone and muscle, sits one of the most extraordinary machines ever to exist. From the moment it first formed inside your mother\'s body, your heart has been beating without stopping — over a hundred thousand times every single day. By the time you reach old age, it will have completed three billion beats, and it will never have asked for a rest.<br><br><b>B.</b> The heart is not a single chamber, as many people imagine. It has four — two upper chambers called atria, and two lower chambers called ventricles. Blood arrives from the body, flows into the right side of the heart, and is sent to the lungs to collect oxygen. It then returns to the left side, which pumps the oxygen-rich blood out to every cell in the body.<br><br><b>C.</b> What makes the heart even more remarkable is its intelligence. The heart has its own electrical system that controls its rhythm, sending pulses through special muscle cells without needing instructions from the brain. When you exercise, your heart speeds up automatically; when you sleep, it slows down. Even when scientists transplant a heart from one body to another, it begins to beat again as soon as it is connected.<br><br><b>D.</b> But the heart is not unbreakable. Diets high in salt or saturated fat, smoking, and a lack of exercise can damage it over many years. Heart disease is now one of the world\'s leading causes of death. The good news is that simple choices — walking more, eating fresh food, sleeping well — can keep this incredible machine running healthily for decades.<br><br><b>E.</b> The heart is a strange teacher. It works for you constantly, asking very little in return, yet most people never thank it. Maybe one day, when you are quiet, you can place your hand on your chest, feel its faithful rhythm, and remember: you are alive because something deep inside you has chosen, three billion times, to keep going.'},
 {kind:'q', num:61, q:'In paragraph A, how many times does the heart beat in a day, approximately?', a:'Over 100,000 times', exp:'Para A: "over a hundred thousand times every single day".', ref:'Reading R1', pts:'0.25đ'},
 {kind:'q', num:62, q:'In paragraph B, identify <b>one adjective</b> and <b>one verb</b>.', a:'Adj: single, upper, lower, oxygen-rich · Verb: arrives, flows, sent, collect, pumps', exp:'Có nhiều lựa chọn đúng.', ref:'Reading R2', pts:'0.25đ'},
 {kind:'q', num:63, q:'In paragraph C, the writer says the heart has "intelligence". Explain <b>in your own words</b> what this means in context.', a:'The heart can control itself / works without instructions from the brain', exp:'<b>Sample:</b> The heart can change its own speed without needing the brain — it has its own control system.', ref:'Reading R7', pts:'0.25đ'},
 {kind:'q', num:64, q:'In paragraph D, why does the writer mention diet, smoking and exercise?',
  subq:'<div class="options"><p>A. To say all hearts will eventually fail.</p><p>B. To show that lifestyle choices affect heart health.</p><p>C. To prove that food is more important than exercise.</p><p>D. To explain how to perform a heart transplant.</p></div>',
  a:'B', exp:'Para D liệt kê lifestyle factors có thể bảo vệ/làm hại tim.', ref:'Reading R3', pts:'0.25đ'},
 {kind:'q', num:65, q:'Give a synonym for "faithful" as used in paragraph E.', a:'loyal / steady / reliable / constant', exp:'<b>Faithful</b> = trung thành, không ngừng.', ref:'Reading R4', pts:'0.25đ'},
 {kind:'q', num:66, q:'In paragraph D, explain <b>in your own words</b> one specific way to keep the heart healthy.', a:'Câu mở', exp:'<b>Sample:</b> Walk every day, eat fresh fruit and vegetables instead of fast food, and get enough sleep each night.', ref:'Reading R6', pts:'0.25đ'},
 {kind:'q', num:67, q:'T/F/NG:<br>A. The heart has four chambers.<br>B. The heart needs instructions from the brain to beat.', a:'A: TRUE — B: FALSE', exp:'A: Para B ✓. B: Para C "without needing instructions from the brain" → FALSE.', ref:'Reading R5', pts:'0.25đ'},
 {kind:'q', num:68, q:'T/F/NG:<br>A. The text says a transplanted heart can begin to beat again.<br>B. Heart disease is the cause of every death in the world.', a:'A: TRUE — B: FALSE', exp:'A: Para C ✓. B: Para D "one of the leading causes" — KHÔNG phải mọi cái chết → FALSE.', ref:'Reading R5', pts:'0.25đ'},

 {kind:'section', text:'PART 4 — WRITING (Health proposal)'},
 {kind:'instruction', text:'Imagine your school is planning a Health Week to encourage students to live more healthily. Write a short proposal for ONE specific health activity. <b>Three paragraphs.</b><br>✦ Description of the activity.<br>✦ Why students would enjoy it.<br>✦ How it would benefit student health.<br>Write <b>100-150 words</b>.'},
 {kind:'q', num:69, q:'Viết bài Writing. Bấm "Xem đáp án" để xem mẫu.', a:'Sample + Rubric',
  exp:'<b>Sample (~130 từ):</b><br><em>For our school\'s Health Week, I propose a "Healthy Lunch Challenge". Each day, the cafeteria offers one special, low-cost, balanced meal — a mix of vegetables, protein, and brown rice — and students who choose it get a stamp on a colourful card. Five stamps earn a small prize.<br><br>Students would enjoy this activity because it feels like a game, not a lecture. The meals would look bright and taste fresh, and the prizes — water bottles, fruit baskets, or sports passes — would be both useful and exciting. Friends could join together, encouraging each other and comparing cards.<br><br>The benefit to student health is real. A balanced lunch gives steady energy throughout the afternoon, supports concentration in class, and slowly builds healthier eating habits. The Healthy Lunch Challenge turns a daily decision into a fun experience — and shows students that good food does not have to be boring.</em>',
  ref:'Writing', pts:'2đ'}
]},
{n:8, type:'mix', title:'Day 8 — Math L20-22 + Science L19-21', time:'~90-120 phút · 60 câu', focus:'Math: Volume & Surface Area, Similarity & Congruence, Circles. Science: Compression & Pressure, Biological Levers, Fuels & Combustion.', items:[
 {kind:'section', text:'PART 1 — MATHEMATICS (30 câu)'},
 {kind:'subsection', text:'M.L20 — Volume & Surface Area (12 câu)'},
 {kind:'q', num:1, q:'A cuboid measures 6 × 4 × 3 cm. Find the volume.', a:'72 cm³', exp:'V = l × w × h = 6 × 4 × 3 = <b>72 cm³</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:2, q:'A cuboid 30 cm × 15 cm × 80 cm. Find the volume.', a:'36,000 cm³', exp:'30 × 15 × 80 = <b>36,000 cm³</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:3, q:'Cuboid 6 × 4 × 3 cm. Find the total surface area.', a:'108 cm²', exp:'SA = 2(6×4 + 4×3 + 6×3) = 2(54) = <b>108 cm²</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:4, q:'A cylinder radius 5 cm, height 12 cm. Volume (π ≈ 3.14, 1 d.p.)?', a:'942.0 cm³', exp:'V = πr²h = 3.14 × 25 × 12 = <b>942.0 cm³</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:5, q:'Cylindrical tank: diameter 4 m, depth 2 m. Volume? (π ≈ 3.14, 1 d.p.)', a:'25.1 m³', exp:'r = 2 m. V = π × 2² × 2 = <b>25.1 m³</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:6, q:'A cube has edges 5 cm. Find its volume.', a:'125 cm³', exp:'V = 5³ = <b>125 cm³</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:7, q:'A cube has edges 5 cm. Find its total surface area.', a:'150 cm²', exp:'SA = 6 × 5² = 6 × 25 = <b>150 cm²</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:8, q:'A triangular prism: cross-section is a right triangle with legs 3 cm, 4 cm. Length 10 cm. Volume?', a:'60 cm³', exp:'Area triangle = (1/2)(3)(4) = 6. V = 6 × 10 = <b>60 cm³</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:9, q:'A cylinder radius 3 cm, height 7 cm. Find the curved surface area (π ≈ 3.14, 1 d.p.).', a:'131.9 cm²', exp:'CSA = 2πrh = 2 × 3.14 × 3 × 7 = <b>131.9 cm²</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:10, q:'A sphere has radius 6 cm. Find its volume. (Use V = (4/3)πr³, π ≈ 3.14)', a:'≈ 904 cm³', exp:'V = (4/3) × 3.14 × 216 = <b>≈ 904 cm³</b>.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:11, q:'1000 cm³ = ___ litres', a:'1 litre', exp:'1 L = <b>1000 cm³</b> = 1000 mL.', ref:'M.L20', pts:'0.05đ'},
 {kind:'q', num:12, q:'A box has volume 800 cm³. If it is full of water, how many litres is that?', a:'0.8 litres', exp:'800 ÷ 1000 = <b>0.8 L</b>.', ref:'M.L20', pts:'0.05đ'},

 {kind:'subsection', text:'M.L21 — Similarity & Congruence (8 câu)'},
 {kind:'q', num:13, q:'Two triangles are similar. The first has sides 3, 4, 5 cm. In the second, the longest side is 15 cm. Find the SHORTEST side of the second triangle.', a:'9 cm', exp:'Scale factor = 15/5 = 3. Shortest = 3 × 3 = <b>9 cm</b>.', ref:'M.L21', pts:'0.05đ'},
 {kind:'q', num:14, q:'In Q13, find the MIDDLE side of the second triangle.', a:'12 cm', exp:'Middle = 4 × 3 = <b>12 cm</b>.', ref:'M.L21', pts:'0.05đ'},
 {kind:'q', num:15, q:'Two similar rectangles. The first is 5 cm × 8 cm. The second has length 12 cm. Find the second\'s width.', a:'7.5 cm', exp:'Scale factor = 12/8 = 1.5. Width = 5 × 1.5 = <b>7.5 cm</b>.', ref:'M.L21', pts:'0.05đ'},
 {kind:'q', num:16, q:'What is the difference between SIMILAR and CONGRUENT shapes?', a:'Similar: same shape, different sizes. Congruent: same shape AND same size.', exp:'Congruent = giống hệt; Similar = cùng hình dạng nhưng có thể khác kích thước.', ref:'M.L21', pts:'0.05đ'},
 {kind:'q', num:17, q:'Two triangles have all three pairs of sides equal. Are they congruent?', a:'Yes (SSS congruence)', exp:'<b>SSS</b> (Side-Side-Side) → congruent.', ref:'M.L21', pts:'0.05đ'},
 {kind:'q', num:18, q:'Two similar triangles. Areas are 16 cm² and 64 cm². Find the linear scale factor.', a:'2', exp:'Area sf = 64/16 = 4 → linear sf = √4 = <b>2</b>.', ref:'M.L21', pts:'0.05đ'},
 {kind:'q', num:19, q:'Triangle ABC similar to DEF. ∠A = 70°, ∠B = 50°. Find ∠F.', a:'60°', exp:'∠C = 180 − 70 − 50 = 60°. ∠F corresponds to ∠C → <b>60°</b>.', ref:'M.L21', pts:'0.05đ'},
 {kind:'q', num:20, q:'A photo 10 cm × 15 cm is enlarged to 30 cm long. Find the new width.', a:'20 cm', exp:'sf = 30/15 = 2. Width = 10 × 2 = <b>20 cm</b>.', ref:'M.L21', pts:'0.05đ'},

 {kind:'subsection', text:'M.L22 — Circles (10 câu)'},
 {kind:'q', num:21, q:'A circle has radius 7 cm. Find its circumference. (π ≈ 3.14, 1 d.p.)', a:'44.0 cm', exp:'C = 2πr = 2 × 3.14 × 7 = <b>44.0 cm</b>.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:22, q:'A circle has diameter 10 cm. Find its area. (π ≈ 3.14)', a:'78.5 cm²', exp:'r = 5. A = πr² = 3.14 × 25 = <b>78.5 cm²</b>.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:23, q:'A line from the centre of a circle to a point on the edge is called?', a:'Radius', exp:'<b>Radius</b> = bán kính.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:24, q:'A line passing through the centre, joining two points on the edge?', a:'Diameter', exp:'<b>Diameter</b> = đường kính. Diameter = 2 × radius.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:25, q:'A line joining 2 points on the circle but NOT through the centre?', a:'Chord', exp:'<b>Chord</b> = dây cung.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:26, q:'Find the area of a circle with radius 4 cm. (π ≈ 3.14)', a:'50.24 cm² (or 50.3 to 1 d.p.)', exp:'A = π × 16 = 3.14 × 16 = <b>50.24 cm²</b>.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:27, q:'A bicycle wheel has diameter 60 cm. How far does it travel in one full turn?', a:'≈ 188.4 cm (or 1.884 m)', exp:'C = πd = 3.14 × 60 = <b>188.4 cm</b>.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:28, q:'Following Q27, how many turns to travel 1 km?', a:'≈ 531 turns', exp:'1 km = 100,000 cm. 100,000 ÷ 188.4 ≈ <b>531 turns</b>.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:29, q:'A semicircle has radius 10 cm. Find its area. (π ≈ 3.14)', a:'157 cm²', exp:'Full circle: πr² = 314. Semi = 314/2 = <b>157 cm²</b>.', ref:'M.L22', pts:'0.05đ'},
 {kind:'q', num:30, q:'A pie has radius 12 cm. The shaded sector spans 60°. Find the sector area. (π ≈ 3.14)', a:'≈ 75.4 cm²', exp:'Sector area = (60/360) × π × 12² = (1/6) × 452.16 = <b>≈ 75.4 cm²</b>.', ref:'M.L22', pts:'0.05đ'},

 {kind:'section', text:'PART 2 — SCIENCE (30 câu — cluster format theo đề thật)'},

 {kind:'instruction', text:'Use the following passage about pressure to answer questions 31, 32, 33.'},
 {kind:'passage', text:'Pressure measures how concentrated a force is on a surface. The formula is <b>P = F ÷ A</b> (pressure = force ÷ area). The SI unit of pressure is the <b>pascal (Pa)</b>, equal to N/m². When the SAME force acts on a SMALLER area, pressure is HIGHER — this is why knife blades are sharp (small area → high pressure cuts easily). When the same force acts on a LARGER area, pressure is LOWER — this is why wide flat shoes don\'t sink into sand.'},
 {kind:'q', num:31, q:'Write the formula for pressure.', a:'P = F ÷ A (Pressure = Force / Area)', exp:'Theo bài.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:32, q:'What is the SI unit of pressure?', a:'Pascal (Pa) = N/m²', exp:'Pascal là đơn vị áp suất.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:33, q:'A sharp knife has SMALLER area at the edge — this gives HIGHER ___ (for the same force).', a:'Pressure', exp:'P = F/A. A nhỏ (lưỡi sắc) → P lớn (cùng F) → cắt dễ hơn.<br>Tương tự: kim, đinh nhọn — A bé → P lớn → đâm xuyên.<br>Ngược lại: giày phẳng rộng — A lớn → P nhỏ → không lún cát.', ref:'S.L19', pts:'0.1đ'},

 {kind:'instruction', text:'A textbook of weight 20 N rests on a desk. The bottom cover area touching the desk is 0.04 m². (Questions 34, 35, 36)'},
 {kind:'q', num:34, q:'Calculate the pressure on the desk in pascals.', a:'500 Pa', exp:'P = F/A = 20/0.04 = <b>500 Pa</b>.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:35, q:'If the book is placed on its narrow EDGE (area = 0.005 m²), calculate the new pressure.', a:'4000 Pa', exp:'20 / 0.005 = <b>4000 Pa</b> — gấp 8 lần.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:36, q:'When the SAME force acts on a SMALLER area, pressure ___?', a:'Increases (goes up)', exp:'P = F/A. F cố định, A giảm → P tăng.<br>Đó là lý do sách đặt cạnh (A nhỏ) ép mạnh hơn sách đặt bằng (A lớn). Hoặc giày cao gót (A bé) ép mạnh hơn giày thường lên cùng diện tích sàn.', ref:'S.L19', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about Hooke\'s Law to answer questions 37, 38, 39.'},
 {kind:'passage', text:'<b>Hooke\'s Law</b> states that the extension of a spring is DIRECTLY PROPORTIONAL to the force applied to it — as long as you do not stretch it past its <b>elastic limit</b>. The equation is <b>F = k × x</b>, where F is force (N), k is the spring constant (N/cm), and x is the extension (cm). Past the elastic limit, the spring is permanently deformed and Hooke\'s Law no longer applies.'},
 {kind:'q', num:37, q:'State Hooke\'s Law in words.', a:'Extension of a spring is directly proportional to the force applied (within elastic limit)', exp:'F = kx; chỉ đúng trong giới hạn đàn hồi.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:38, q:'A spring extends 4 cm under a force of 10 N. What is the spring constant k?', a:'2.5 N/cm', exp:'k = F/x = 10/4 = <b>2.5 N/cm</b>.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:39, q:'Using k from Q38, how far will the spring extend under 25 N?', a:'10 cm', exp:'x = F/k = 25/2.5 = <b>10 cm</b>.', ref:'S.L19', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about levers to answer questions 40, 41, 42.'},
 {kind:'passage', text:'A lever has three parts: the <b>fulcrum</b> (pivot point), the <b>load</b> (what you are lifting), and the <b>effort</b> (force you apply). There are three CLASSES depending on what is in the middle:<br>• <b>Class 1</b>: fulcrum in the middle (e.g. scissors, see-saw)<br>• <b>Class 2</b>: load in the middle (e.g. wheelbarrow)<br>• <b>Class 3</b>: effort in the middle (e.g. human arm lifting a weight)'},
 {kind:'q', num:40, q:'Name the part of a lever that acts as the PIVOT POINT.', a:'Fulcrum',
  exp:'<b>Fulcrum</b> = điểm tựa, nơi đòn bẩy xoay quanh.<br><br><b>📚 Học toàn bộ 3 bộ phận lever:</b><br>• <b>Fulcrum</b> (điểm tựa) — nơi đòn bẩy quay.<br>• <b>Load</b> (tải) — vật cần di chuyển/nâng.<br>• <b>Effort</b> (lực) — lực do ta tác dụng.<br><br>Vị trí TƯƠNG ĐỐI của 3 bộ phận này quyết định <b>class</b> của lever (1/2/3).', ref:'S.L20', pts:'0.1đ'},
 {kind:'q', num:41, q:'Tweezers (used to grip small objects) — which CLASS of lever?', a:'Class 3',
  exp:'<b>Tweezers = Class 3 lever:</b> điểm tựa ở đầu nối (fulcrum), bạn ép vào giữa (effort), đầu kẹp giữ vật (load).<br>→ <b>Effort ở giữa</b> fulcrum và load = Class 3.<br><br><b>📚 Các ví dụ Class 3 khác:</b> cánh tay người, cần câu cá, gậy đánh golf, dao bay xúc cát.<br><br><b>Đặc điểm Class 3:</b> cần LỰC LỚN HƠN load, nhưng đổi lại đầu lever di chuyển nhanh + xa (good for speed).', ref:'S.L20', pts:'0.1đ'},
 {kind:'q', num:42, q:'A bottle opener removing a cap (lip of opener = fulcrum, hand pushes other end) — which CLASS of lever?', a:'Class 2',
  exp:'<b>Bottle opener = Class 2 lever:</b> fulcrum ở mép chai, cap (load) ở giữa, tay (effort) ở đầu cán.<br>→ <b>Load ở giữa</b> fulcrum và effort = Class 2.<br><br><b>📚 Các ví dụ Class 2 khác:</b> wheelbarrow, dao bè (nutcracker thường), thuyền chèo.<br><br><b>Đặc điểm Class 2:</b> luôn cho mechanical advantage (giảm lực) — dùng để nâng vật nặng dễ hơn.', ref:'S.L20', pts:'0.1đ'},

 {kind:'instruction', text:'Figure 1 shows a lever with the LOAD of 60 N at 0.2 m from the fulcrum. The effort is applied at 0.6 m from the fulcrum. (Questions 43, 44, 45)'},
 {kind:'figure', text:'<svg viewBox="0 0 500 200" style="max-width:500px"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#2563eb"/></marker></defs><rect x="60" y="90" width="380" height="14" fill="#a16207" stroke="#000" stroke-width="1.5"/><polygon points="200,104 235,150 165,150" fill="#475569" stroke="#000"/><text x="200" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Fulcrum</text><rect x="75" y="50" width="60" height="40" fill="#dc2626" stroke="#000" stroke-width="1.5"/><text x="105" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fff" font-weight="bold">60 N</text><text x="105" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">LOAD</text><line x1="410" y1="30" x2="410" y2="85" stroke="#000" stroke-width="3"/><polygon points="410,90 405,80 415,80" fill="#000"/><text x="410" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">EFFORT F = ?</text><line x1="105" y1="115" x2="200" y2="115" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/><line x1="200" y1="115" x2="105" y2="115" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/><text x="152" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2563eb" font-weight="bold">0.2 m</text><line x1="200" y1="115" x2="410" y2="115" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/><line x1="410" y1="115" x2="200" y2="115" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar)"/><text x="305" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c3aed" font-weight="bold">0.6 m</text></svg>'},
 {kind:'q', num:43, q:'Write the equation that must be true for the lever to balance (principle of moments).', a:'Load × distance from fulcrum = Effort × distance from fulcrum', exp:'Moments cân bằng.', ref:'S.L20', pts:'0.1đ'},
 {kind:'q', num:44, q:'Calculate the EFFORT (F) needed to balance the load.', a:'20 N', exp:'F × 0.6 = 60 × 0.2 → F = 12/0.6 = <b>20 N</b>.', ref:'S.L20', pts:'0.1đ'},
 {kind:'q', num:45, q:'Name ONE advantage of using a lever.', a:'Less force needed to move a heavy load (mechanical advantage)', exp:'Đòn bẩy giảm sức.', ref:'S.L20', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about combustion to answer questions 46, 47, 48.'},
 {kind:'passage', text:'Combustion requires three things, called the <b>fire triangle</b>: fuel, oxygen, and heat. Remove any one and the fire goes out. <b>COMPLETE combustion</b> (enough O₂) produces carbon dioxide and water. <b>INCOMPLETE combustion</b> (limited O₂) produces carbon monoxide (CO — a poisonous gas) and sometimes carbon (soot). Methane (CH₄), the main gas in natural gas, is a common household fuel.'},
 {kind:'q', num:46, q:'Name the THREE things needed for combustion (the fire triangle).', a:'Fuel, oxygen, heat', exp:'Fire triangle: 3 yếu tố.', ref:'S.L21', pts:'0.1đ'},
 {kind:'q', num:47, q:'Write the word equation for COMPLETE combustion of methane.', a:'methane + oxygen → carbon dioxide + water', exp:'CH₄ + 2O₂ → CO₂ + 2H₂O.', ref:'S.L21', pts:'0.1đ'},
 {kind:'q', num:48, q:'Name the POISONOUS gas produced by incomplete combustion.', a:'Carbon monoxide (CO)', exp:'<b>Carbon monoxide (CO)</b> không màu, không mùi → rất nguy hiểm.<br>Gắn vào hemoglobin chặt hơn O₂ ~250 lần → ngăn vận chuyển O₂ → ngạt thở → tử vong.<br><b>Phòng tránh:</b> ống thông gió tốt khi đun gas/than; lắp CO detector.', ref:'S.L21', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about fossil fuels to answer questions 49, 50, 51.'},
 {kind:'passage', text:'<b>Fossil fuels</b> — coal, oil, and natural gas — are formed from the dead remains of organisms over millions of years. They are described as <b>non-renewable</b> because they take so long to form. Burning fossil fuels releases carbon dioxide (CO₂), a greenhouse gas, contributing to <b>climate change</b>. Sulfur impurities also release sulfur dioxide (SO₂), which causes <b>acid rain</b>. Renewable alternatives include solar, wind, hydro, and biomass energy.'},
 {kind:'q', num:49, q:'Name THREE fossil fuels.', a:'Coal, oil, natural gas', exp:'Theo bài.', ref:'S.L21', pts:'0.1đ'},
 {kind:'q', num:50, q:'How many YEARS does it take for fossil fuels to form?', a:'Millions of years', exp:'<b>Fossil fuels</b> (coal, oil, natural gas) hình thành từ xác sinh vật bị nén ép qua <b>hàng triệu năm</b>.<br>Con người đang dùng nhanh hơn nhiều so với tốc độ hình thành → "non-renewable" (không tái tạo trong thời gian con người).<br>Khác với renewable: solar, wind, hydro, biomass — tái tạo nhanh.', ref:'S.L21', pts:'0.1đ'},
 {kind:'q', num:51, q:'Name TWO renewable energy sources.', a:'Any 2 of: solar, wind, hydro, biomass, geothermal, tidal', exp:'Theo bài + kiến thức.', ref:'S.L21', pts:'0.1đ'},

 {kind:'instruction', text:'Acid rain forms when SO₂ and NOₓ from burning fossil fuels dissolve in atmospheric water. (Questions 52, 53, 54)'},
 {kind:'q', num:52, q:'What gas is released when SULFUR impurities in coal/oil burn?', a:'Sulfur dioxide (SO₂)', exp:'SO₂ → mưa axit.', ref:'S.L21', pts:'0.1đ'},
 {kind:'q', num:53, q:'What is "acid rain"?', a:'Rain with dissolved SO₂ and NOₓ forming weak sulfuric and nitric acids', exp:'Mưa có axit yếu.', ref:'S.L21', pts:'0.1đ'},
 {kind:'q', num:54, q:'Name TWO harmful effects of acid rain.', a:'Any 2: damages limestone buildings/statues, harms forests/trees, kills fish in lakes, corrodes metal structures', exp:'Acid rain gây nhiều tác hại.', ref:'S.L21', pts:'0.1đ'},

 {kind:'instruction', text:'(Questions 55-60) Mixed single questions on pressure, levers, fuels.'},
 {kind:'q', num:55, q:'A person of weight 600 N stands on ONE foot (area 0.02 m²). Calculate pressure.', a:'30,000 Pa (30 kPa)', exp:'600/0.02 = <b>30,000 Pa</b>.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:56, q:'A wider contact area gives LOWER ___?', a:'Pressure', exp:'P = F/A. A lớn → P nhỏ.<br>Vì vậy giày phẳng rộng (A lớn) không lún cát; giày cao gót (A bé) → P cao → lún.<br>Cùng nguyên tắc: bánh xe tăng (caterpillar tracks) rộng → đi trên đất mềm không lún.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:57, q:'A pair of scissors is what class of lever?', a:'Class 1 (fulcrum in middle)', exp:'Fulcrum (đinh tán) giữa.', ref:'S.L20', pts:'0.1đ'},
 {kind:'q', num:58, q:'What is the SI unit for FORCE?', a:'Newton (N)', exp:'Đơn vị lực.', ref:'S.L19', pts:'0.1đ'},
 {kind:'q', num:59, q:'Which GAS released by burning fossil fuels contributes most to climate change?', a:'Carbon dioxide (CO₂)', exp:'Đốt fossil fuels → <b>CO₂</b> là khí nhà kính chính.<br>CO₂ giữ nhiệt từ mặt trời trong khí quyển → <b>global warming</b> → climate change (băng tan, nước biển dâng, thời tiết cực đoan).<br>Khí nhà kính khác: CH₄ (methane), H₂O hơi, N₂O.', ref:'S.L21', pts:'0.1đ'},
 {kind:'q', num:60, q:'A spring is stretched until it does NOT return to its original length. What has been exceeded?', a:'The elastic limit', exp:'Vượt elastic limit → biến dạng vĩnh viễn.', ref:'S.L19', pts:'0.1đ'},

 {kind:'section', text:'PART 3 — READING (Science/Tech theme)'},
 {kind:'subsection', text:'The Material That Changed Everything'},
 {kind:'passage', text:'<b>A.</b> In the year 1907, an American chemist named Leo Baekeland made an accidental discovery that would change the world. While experimenting with simple chemicals in his laboratory, he created the first ever fully synthetic plastic. He named it Bakelite — and within twenty years, it was everywhere.<br><br><b>B.</b> Bakelite was extraordinary because it could be moulded into almost any shape, then hardened by heat into a strong, glossy material. It was used in telephones, radios, jewellery, and electrical sockets. For the first time in history, factories could mass-produce objects of identical quality at very low cost.<br><br><b>C.</b> Since then, scientists have created thousands of new plastics, each with different properties. Polythene wraps our food. PET makes our water bottles. Nylon is woven into our clothes. Plastics are light, cheap, waterproof, and strong — qualities that no other material in history has combined so completely.<br><br><b>D.</b> But this miracle has a darker side. Most plastics take hundreds of years to break down. Tiny fragments called microplastics now appear in oceans, soil, drinking water, and even inside human bodies. The same qualities that make plastics useful — their long life and resistance to nature — also make them difficult to deal with when we no longer want them.<br><br><b>E.</b> Today, scientists are racing to invent new materials that combine the best of plastics with biodegradability. Bioplastics made from corn, bamboo, or seaweed are already appearing in shops. The story of plastic reminds us that every invention carries responsibility — and that materials shape not just our lives but our future.'},
 {kind:'q', num:61, q:'In paragraph A, who invented the first fully synthetic plastic?', a:'Leo Baekeland', exp:'Para A: "Leo Baekeland".', ref:'Reading R1', pts:'0.25đ'},
 {kind:'q', num:62, q:'In paragraph B, identify <b>one adjective</b> and <b>one verb</b>.', a:'Adj: extraordinary, strong, glossy, identical · Verb: moulded, hardened, used, mass-produce', exp:'Nhiều lựa chọn.', ref:'Reading R2', pts:'0.25đ'},
 {kind:'q', num:63, q:'In paragraph A, the writer says Bakelite\'s discovery was "accidental". Explain <b>in your own words</b> what "accidental" means.', a:'Not planned / happened by chance', exp:'<b>Accidental</b> = tình cờ, không có chủ ý.', ref:'Reading R7', pts:'0.25đ'},
 {kind:'q', num:64, q:'In paragraph D, why does the writer call plastics a "miracle" with a "darker side"?',
  subq:'<div class="options"><p>A. To say plastics never break.</p><p>B. To show plastics are useful BUT also harmful.</p><p>C. To prove plastics cause magic.</p><p>D. To explain how to recycle plastic.</p></div>',
  a:'B', exp:'Para D nói cùng tính chất giúp plastic hữu ích lại làm khó tái xử lý → tốt + xấu.', ref:'Reading R3', pts:'0.25đ'},
 {kind:'q', num:65, q:'Give a synonym for "fragments" as used in paragraph D.', a:'pieces / bits / particles', exp:'<b>Fragments</b> = mảnh nhỏ.', ref:'Reading R4', pts:'0.25đ'},
 {kind:'q', num:66, q:'In paragraph E, explain <b>in your own words</b> what bioplastics are made from.', a:'Câu mở', exp:'<b>Sample:</b> Bioplastics are made from natural living materials like corn plants, bamboo trees, or seaweed, not from oil.', ref:'Reading R6', pts:'0.25đ'},
 {kind:'q', num:67, q:'T/F/NG:<br>A. Bakelite was invented in 1907.<br>B. Bioplastics are now the most-used plastic in the world.', a:'A: TRUE — B: NOT GIVEN', exp:'A: Para A ✓. B: bài không nói bioplastic được dùng nhiều nhất.', ref:'Reading R5', pts:'0.25đ'},
 {kind:'q', num:68, q:'T/F/NG:<br>A. Microplastics have been found inside human bodies.<br>B. All plastics today are biodegradable.', a:'A: TRUE — B: FALSE', exp:'A: Para D ✓. B: Para D nói plastic mất hàng trăm năm để phân huỷ → FALSE.', ref:'Reading R5', pts:'0.25đ'},

 {kind:'section', text:'PART 4 — WRITING (Technology proposal)'},
 {kind:'instruction', text:'Imagine your school is considering whether to install free WiFi in the library. Some teachers worry students will misuse it. Write a proposal arguing FOR free WiFi in the library. <b>Three paragraphs.</b><br>✦ Your proposal.<br>✦ Educational benefits for students.<br>✦ How to manage concerns about misuse.<br>Write <b>100-150 words</b>.'},
 {kind:'q', num:69, q:'Viết bài Writing. Bấm "Xem đáp án" để xem mẫu.', a:'Sample + Rubric',
  exp:'<b>Sample (~130 từ):</b><br><em>Our school should install free WiFi in the library. Students would have safe, controlled internet access for research, online textbooks, and educational videos — turning the library into a true 21st-century learning space.<br><br>The educational benefits are huge. Students could check facts instantly, access digital research papers, watch revision videos, and collaborate on shared documents during group work. For students without home internet, the library WiFi would close a real learning gap and give everyone an equal chance to succeed.<br><br>I understand teachers worry about misuse. To address this, the school could install a content filter blocking social media and games during school hours, require students to log in with school accounts, and have a librarian on duty. With these measures, free WiFi becomes a tool for learning, not distraction — and the library becomes the heart of modern education.</em>',
  ref:'Writing', pts:'2đ'}
]},
{n:9, type:'mix', title:'Day 9 — Math L23-24 + Science L22-25', time:'~90-120 phút · 60 câu', focus:'Math: Probability, Pythagoras & Trigonometry. Science: Earth & Atmosphere, Ecology, Energy & Forces, Motion.', items:[
 {kind:'section', text:'PART 1 — MATHEMATICS (30 câu)'},
 {kind:'subsection', text:'M.L23 — Probability (15 câu)'},
 {kind:'q', num:1, q:'A bag contains 5 red and 7 blue balls. P(red)? (simplest form)', a:'5/12', exp:'5 / (5+7) = <b>5/12</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:2, q:'P(blue) from the same bag.', a:'7/12', exp:'7/12.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:3, q:'Verify: P(red) + P(blue) = ?', a:'1', exp:'Tổng xác suất các kết quả = <b>1</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:4, q:'Roll a fair 6-sided die. P(rolling a 3)?', a:'1/6', exp:'1 mặt trong 6 → <b>1/6</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:5, q:'Roll a die. P(rolling an EVEN number)?', a:'1/2', exp:'3 trong 6 = <b>1/2</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:6, q:'Roll a die. P(rolling a number > 4)?', a:'1/3', exp:'2 trong 6 (5, 6) = <b>1/3</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:7, q:'A pack of 52 cards. P(drawing a Heart)?', a:'1/4', exp:'13/52 = <b>1/4</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:8, q:'52 cards. P(drawing a King)?', a:'1/13', exp:'4/52 = <b>1/13</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:9, q:'52 cards. P(drawing a red King)?', a:'1/26', exp:'2/52 = <b>1/26</b> (King of Hearts, King of Diamonds).', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:10, q:'Flip 2 coins. P(both heads)?', a:'1/4', exp:'P(HH) = 1/2 × 1/2 = <b>1/4</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:11, q:'Flip 2 coins. P(at least 1 head)?', a:'3/4', exp:'P(no heads = TT) = 1/4. P(at least 1) = 1 − 1/4 = <b>3/4</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:12, q:'A bag has 4 red, 6 blue, 10 green. P(green)?', a:'1/2', exp:'10/20 = <b>1/2</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:13, q:'A spinner has 8 equal sectors numbered 1-8. P(prime number)?', a:'1/2', exp:'Primes in 1-8: 2, 3, 5, 7 → 4 numbers → 4/8 = <b>1/2</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:14, q:'P(rolling a 1 or 6 on a die)?', a:'1/3', exp:'2/6 = <b>1/3</b>.', ref:'M.L23', pts:'0.05đ'},
 {kind:'q', num:15, q:'A bag has 5 red and 5 blue. Pick 1, put back, pick again. P(both red)?', a:'1/4', exp:'P(red) = 1/2 mỗi lần → 1/2 × 1/2 = <b>1/4</b>. (Independent events with replacement.)', ref:'M.L23', pts:'0.05đ'},

 {kind:'subsection', text:'M.L24 — Pythagoras & Trigonometry (15 câu)'},
 {kind:'q', num:16, q:'Right triangle: shorter sides 3 and 4. Find hypotenuse.', a:'5', exp:'c² = 3² + 4² = 25 → c = <b>5</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:17, q:'Right triangle: shorter sides 6 and 8. Find hypotenuse.', a:'10', exp:'c² = 36 + 64 = 100 → c = <b>10</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:18, q:'Right triangle: shorter sides 5 and 12. Find hypotenuse.', a:'13', exp:'c² = 25 + 144 = 169 → c = <b>13</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:19, q:'Right triangle: hypotenuse 10, one side 6. Find the other side.', a:'8', exp:'b² = 10² − 6² = 64 → b = <b>8</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:20, q:'Right triangle: hypotenuse 25, one side 7. Find the other side.', a:'24', exp:'b² = 625 − 49 = 576 → b = <b>24</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:21, q:'A ladder 5 m long leans against a wall, foot 3 m from base. How high up the wall does it reach?', a:'4 m', exp:'h² = 25 − 9 = 16 → h = <b>4 m</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:22, q:'State Pythagoras\' theorem.', a:'In a right triangle, a² + b² = c² (where c is the hypotenuse)', exp:'<b>a² + b² = c²</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:23, q:'In a right triangle, sin θ = opposite ÷ ?', a:'hypotenuse', exp:'<b>sin = O / H</b>. (SOH-CAH-TOA)', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:24, q:'In a right triangle, cos θ = ? ÷ hypotenuse', a:'adjacent', exp:'<b>cos = A / H</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:25, q:'In a right triangle, tan θ = opposite ÷ ?', a:'adjacent', exp:'<b>tan = O / A</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:26, q:'In a right triangle, opposite side = 4, adjacent = 3. Find tan θ.', a:'4/3', exp:'tan = 4/3 (approx 1.33).', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:27, q:'In a right triangle, hypotenuse 10, opposite 6. Find sin θ.', a:'3/5 (or 0.6)', exp:'sin = 6/10 = <b>3/5</b>.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:28, q:'In a right triangle, θ = 30°. Side opposite = ? × hypotenuse (sin 30° = 0.5)', a:'0.5 × hyp', exp:'opposite = sin θ × hyp = 0.5 × hyp.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:29, q:'A right triangle has angle 45°. The two shorter sides are equal — true or false?', a:'True', exp:'45-45-90 triangle có 2 cạnh ngắn bằng nhau.', ref:'M.L24', pts:'0.05đ'},
 {kind:'q', num:30, q:'A square has side 6 cm. Find the diagonal.', a:'6√2 ≈ 8.49 cm', exp:'d² = 6² + 6² = 72 → d = √72 = <b>6√2 ≈ 8.49 cm</b>.', ref:'M.L24', pts:'0.05đ'},

 {kind:'section', text:'PART 2 — SCIENCE (30 câu — cluster format theo đề thật)'},

 {kind:'instruction', text:'Use the following passage about Earth\'s atmosphere to answer questions 31, 32, 33.'},
 {kind:'passage', text:'The Earth\'s atmosphere is a mixture of gases — mostly NITROGEN (about 78%) and OXYGEN (about 21%). Small amounts of <b>carbon dioxide (CO₂)</b>, water vapour, and <b>methane (CH₄)</b> are called "greenhouse gases". They trap heat from the Sun and keep Earth warm enough for life. Since the Industrial Revolution, however, human burning of fossil fuels has INCREASED greenhouse gas levels, leading to global climate change.'},
 {kind:'q', num:31, q:'What two gases make up most of the Earth\'s atmosphere, and in what percentages?', a:'Nitrogen ~78% and Oxygen ~21%', exp:'Theo bài.', ref:'S.L22', pts:'0.1đ'},
 {kind:'q', num:32, q:'Name TWO greenhouse gases (other than water vapour).', a:'Carbon dioxide (CO₂) AND methane (CH₄)', exp:'Theo bài.', ref:'S.L22', pts:'0.1đ'},
 {kind:'q', num:33, q:'What is the main HUMAN activity increasing greenhouse gas levels?', a:'Burning fossil fuels', exp:'Theo bài.', ref:'S.L22', pts:'0.1đ'},

 {kind:'instruction', text:'Figure 1 shows the greenhouse effect: 1) Sun\'s rays enter atmosphere → 2) some heat reflects back from Earth\'s surface → 3) greenhouse gases trap some heat → 4) keeps Earth warm. (Questions 34, 35, 36)'},
 {kind:'figure', text:'<svg viewBox="0 0 500 320" style="max-width:500px"><circle cx="80" cy="60" r="32" fill="#fde047" stroke="#a16207" stroke-width="2"/><text x="80" y="65" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">SUN</text><line x1="100" y1="80" x2="170" y2="170" stroke="#f59e0b" stroke-width="2" marker-end="url(#sunRay)"/><line x1="110" y1="75" x2="220" y2="180" stroke="#f59e0b" stroke-width="2" marker-end="url(#sunRay)"/><line x1="120" y1="70" x2="270" y2="180" stroke="#f59e0b" stroke-width="2" marker-end="url(#sunRay)"/><defs><marker id="sunRay" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#f59e0b"/></marker><marker id="heatArr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#dc2626"/></marker></defs><rect x="20" y="130" width="460" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2"/><text x="250" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3b82f6">Atmosphere (CO₂, CH₄, H₂O vapour) — TRAPS heat</text><rect x="50" y="200" width="400" height="80" fill="#16a34a" stroke="#15803d" stroke-width="2" rx="20"/><text x="250" y="245" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">EARTH</text><text x="250" y="265" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff" font-style="italic">absorbs sun rays + re-emits heat</text><line x1="200" y1="200" x2="200" y2="175" stroke="#dc2626" stroke-width="2" marker-end="url(#heatArr)"/><line x1="300" y1="200" x2="300" y2="175" stroke="#dc2626" stroke-width="2" marker-end="url(#heatArr)"/><line x1="400" y1="200" x2="400" y2="175" stroke="#dc2626" stroke-width="2" marker-end="url(#heatArr)"/><line x1="200" y1="130" x2="200" y2="115" stroke="#dc2626" stroke-width="2" marker-end="url(#heatArr)"/><line x1="300" y1="130" x2="300" y2="105" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/><text x="320" y="105" font-family="sans-serif" font-size="10" fill="#dc2626">some escapes</text><text x="20" y="305" font-family="sans-serif" font-size="10" font-style="italic" fill="#666">More greenhouse gases → MORE heat trapped → global warming → climate change</text></svg>'},
 {kind:'q', num:34, q:'Which type of GAS in the atmosphere TRAPS heat (causing the greenhouse effect)?', a:'Greenhouse gases (CO₂, CH₄, H₂O vapour)', exp:'<b>Greenhouse gases</b> chính: CO₂ (carbon dioxide), CH₄ (methane), H₂O vapour (hơi nước), N₂O.<br>Sun → Earth nóng → phát xạ nhiệt → greenhouse gases giữ lại 1 phần → giữ Trái Đất ấm ~15°C (không có chúng thì Trái Đất sẽ −18°C, sự sống không thể tồn tại).<br>Vấn đề: hoạt động con người tăng CO₂ → quá nhiều nhiệt giữ lại → climate change.', ref:'S.L22', pts:'0.1đ'},
 {kind:'q', num:35, q:'Name TWO effects of human-caused climate change.', a:'Any 2: rising sea levels, melting ice caps, extreme weather, droughts, floods, ecosystem damage', exp:'Hệ quả climate change.', ref:'S.L22', pts:'0.1đ'},
 {kind:'q', num:36, q:'Name TWO ways humans can reduce greenhouse gas emissions.', a:'Any 2: renewable energy, reduce energy use, recycle, plant trees, public transport', exp:'Năng lượng sạch + tiết kiệm + cây xanh.', ref:'S.L22', pts:'0.1đ'},

 {kind:'instruction', text:'Figure 2 shows a simple food chain in a Vietnamese rice field. Use Figure 2 for questions 37, 38, 39.'},
