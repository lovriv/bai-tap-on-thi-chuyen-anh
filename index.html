<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập đầy đủ 10 ngày — Chuyên Anh Đề Án</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Tahoma,sans-serif; background:#eef1f8; color:#1f2937; line-height:1.65; }
  .wrap { max-width:960px; margin:0 auto; padding:18px; }
  header { background:linear-gradient(135deg,#5b54d6,#8b5cf6); color:#fff; border-radius:18px;
           padding:22px 26px; box-shadow:0 8px 24px rgba(91,84,214,.28); }
  header h1 { font-size:1.45rem; margin-bottom:5px; }
  header p { opacity:.94; font-size:.93rem; }
  nav { margin:16px 0; }
  .week-label { font-size:.78rem; font-weight:700; letter-spacing:.06em; color:#6b7280; margin:14px 0 7px; }
  .pills { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px; }
  .pill { background:#fff; border:2px solid #e5e7eb; border-radius:12px; padding:9px 6px;
          cursor:pointer; text-align:center; font-size:.82rem; font-weight:600; transition:.15s; }
  .pill:hover { border-color:#8b5cf6; transform:translateY(-2px); }
  .pill .pd { font-size:.95rem; font-weight:800; }
  .pill .pt { font-size:.72rem; color:#6b7280; }
  .pill.active { background:#8b5cf6; color:#fff; border-color:#8b5cf6; }
  .pill.active .pt { color:#ede9fe; }
  main { background:#fff; border-radius:16px; padding:24px; margin-top:6px;
         box-shadow:0 4px 16px rgba(0,0,0,.06); min-height:300px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:8px; font-size:.76rem;
           font-weight:800; letter-spacing:.04em; color:#fff; margin-bottom:10px; }
  .t-math{background:#2563eb;} .t-science{background:#059669;} .t-english{background:#7c3aed;}
  .t-mock{background:#dc2626;} .t-special{background:#db2777;} .t-mix{background:#0891b2;}
  main h2 { font-size:1.4rem; margin-bottom:4px; }
  .meta { color:#6b7280; font-size:.9rem; margin-bottom:14px; }
  .focus { background:#f5f3ff; border-left:4px solid #8b5cf6; padding:11px 14px;
           border-radius:8px; font-size:.95rem; margin-bottom:18px; }
  .focus b { color:#5b21b6; }
  .section-h { background:#1e293b; color:#fff; padding:10px 14px; border-radius:8px;
               font-weight:800; margin:20px 0 10px; font-size:1rem; }
  .subsec-h { background:#dbeafe; color:#1e40af; padding:8px 14px; border-radius:8px;
              font-weight:700; margin:14px 0 8px; font-size:.9rem; }
  .instruction { background:#fef3c7; border-left:4px solid #f59e0b; padding:10px 14px;
                 border-radius:8px; font-style:italic; margin:12px 0 8px; font-size:.92rem; }
  .passage { background:#f9fafb; border:1px solid #e5e7eb; padding:14px 18px; border-radius:10px;
             margin:10px 0 14px; font-size:.95rem; line-height:1.75; }
  .figure { background:#1e293b; color:#a5f3fc; padding:14px; border-radius:10px;
            font-family:Consolas,Monaco,monospace; font-size:.85rem; white-space:pre;
            margin:10px 0 14px; overflow-x:auto; }
  .figure-label { display:block; font-family:'Segoe UI',sans-serif; color:#fde047;
                  font-size:.78rem; font-weight:800; letter-spacing:.06em;
                  margin-bottom:10px; white-space:normal; padding-bottom:8px;
                  border-bottom:1px dashed rgba(253,224,71,.3); }
  .svg-figure { background:#fff; border:2px solid #cbd5e1; border-radius:10px;
                padding:14px; margin:10px 0 14px; text-align:center; }
  .svg-figure .figure-label { color:#0369a1; border-bottom-color:rgba(3,105,161,.3);
                              text-align:left; }
  .svg-figure svg { max-width:100%; height:auto; }
  .q-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px;
            margin:10px 0; }
  .q-card:hover { border-color:#c7d2fe; }
  .q-head { display:flex; gap:10px; align-items:flex-start; margin-bottom:6px; }
  .q-num { background:#8b5cf6; color:#fff; min-width:32px; height:32px; border-radius:50%;
           display:flex; align-items:center; justify-content:center; font-weight:800;
           font-size:.85rem; flex-shrink:0; }
  .q-text { font-size:.96rem; padding-top:4px; }
  .q-meta { font-size:.76rem; color:#9ca3af; margin-top:3px; font-style:italic; }
  .reveal-btn { background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; border:0;
                padding:8px 18px; border-radius:8px; font-weight:700; font-size:.82rem;
                cursor:pointer; margin-top:8px; transition:.2s; }
  .reveal-btn:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(139,92,246,.4); }
  .reveal-btn.shown { background:#6b7280; }
  .answer-panel { display:none; background:#f0fdf4; border:2px solid #22c55e;
                  border-radius:8px; padding:12px 14px; margin-top:8px; }
  .answer-panel.show { display:block; animation:slide .25s ease; }
  @keyframes slide { from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:translateY(0);} }
  .ans-line { margin-bottom:6px; }
  .ans-correct { font-size:1rem; background:#16a34a; color:#fff; padding:3px 10px;
                 border-radius:5px; display:inline-block; font-weight:700; }
  .ans-exp { color:#374151; font-size:.9rem; }
  .ans-ref { font-size:.76rem; color:#6b7280; font-style:italic; margin-top:4px; }
  code { background:#eef1f8; padding:1px 5px; border-radius:4px; font-size:.9em; color:#5b21b6;
         font-family:Consolas,Monaco,monospace; }
  .math { font-family:'Cambria Math',Cambria,Georgia,serif; font-size:1.05em; }
  .options { margin-left:8px; margin-top:6px; }
  .options p { margin:3px 0; }
  .progress-bar { background:#e5e7eb; height:10px; border-radius:8px; margin:8px 0 18px; overflow:hidden; }
  .progress-bar > div { background:linear-gradient(90deg,#22c55e,#16a34a); height:100%; width:0;
                        transition:width .3s; }
  .progress-label { font-size:.83rem; color:#6b7280; font-weight:600; }
  .ud { display:flex; justify-content:space-between; margin-top:24px; gap:8px; }
  .ud button { flex:1; padding:11px; border:2px solid #e5e7eb; background:#fff;
               border-radius:10px; cursor:pointer; font-weight:700; font-size:.85rem; color:#4b5563; }
  .ud button:hover:not(:disabled) { border-color:#8b5cf6; color:#7c3aed; }
  .ud button:disabled { opacity:.35; cursor:default; }
  footer { text-align:center; color:#9ca3af; font-size:.82rem; padding:20px 0; }
  .reveal-all-btn { background:#fef3c7; color:#92400e; border:1px solid #fcd34d;
                    padding:7px 12px; border-radius:8px; font-size:.78rem; font-weight:600;
                    cursor:pointer; margin-right:6px; }
  .reveal-all-btn:hover { background:#fde68a; }

  /* ===== INPUT + AUTO-CHECK ===== */
  .answer-input, .writing-area {
    width:100%; padding:10px 12px; border:2px solid #d1d5db; border-radius:8px;
    font-size:.95rem; font-family:inherit; margin-top:8px; box-sizing:border-box;
    resize:vertical; transition:.2s; line-height:1.5;
  }
  .answer-input { min-height:42px; }
  .writing-area { min-height:240px; }
  .answer-input:focus, .writing-area:focus { outline:0; border-color:#8b5cf6; }
  .answer-input.correct { border-color:#16a34a; background:#f0fdf4; }
  .answer-input.incorrect { border-color:#dc2626; background:#fef2f2; }
  .answer-input.manual { border-color:#f59e0b; background:#fffbeb; }
  .check-btn {
    background:linear-gradient(135deg,#2563eb,#3b82f6); color:#fff; border:0;
    padding:8px 18px; border-radius:8px; font-weight:700; font-size:.85rem;
    cursor:pointer; margin-top:8px; transition:.2s;
  }
  .check-btn:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(37,99,235,.4); }
  .result-icon { display:inline-block; margin-left:10px; font-size:1.4rem; font-weight:800; vertical-align:middle; }
  .result-icon.correct { color:#16a34a; }
  .result-icon.incorrect { color:#dc2626; }
  .result-icon.partial, .result-icon.manual { color:#f59e0b; }
  .word-counter { font-size:.85rem; color:#6b7280; margin-top:4px; margin-bottom:4px; font-weight:600; }
  .word-counter.in-range { color:#16a34a; }
  .word-counter.out-range { color:#dc2626; }
  .manual-mark { margin-top:10px; padding-top:10px; border-top:1px dashed #86efac; font-size:.85rem; }
  .mini-btn {
    background:#fff; border:1px solid #d1d5db; padding:4px 10px; border-radius:6px;
    cursor:pointer; font-size:.8rem; margin-left:4px;
  }
  .mini-btn:hover { background:#f3f4f6; border-color:#8b5cf6; }
  .mini-btn.active-correct { background:#16a34a; color:#fff; border-color:#16a34a; }
  .mini-btn.active-incorrect { background:#dc2626; color:#fff; border-color:#dc2626; }
  /* ===== SCORE & HISTORY ===== */
  .score-panel {
    background:linear-gradient(135deg,#fef3c7,#fde68a); border:2px solid #f59e0b;
    border-radius:14px; padding:18px; margin:16px 0; text-align:center;
  }
  .score-big { font-size:1.8rem; font-weight:800; color:#b45309; }
  .score-detail { font-size:.9rem; color:#92400e; margin-top:8px; }
  .score-detail b { color:#7c2d12; }
  .score-btn {
    background:#f59e0b; color:#fff; border:0; padding:10px 18px; border-radius:8px;
    font-weight:700; margin:6px 4px 0; cursor:pointer; font-size:.85rem;
  }
  .score-btn:hover { background:#d97706; }
  .score-btn.reset-btn { background:#dc2626; }
  .score-btn.reset-btn:hover { background:#b91c1c; }
  .history {
    background:#f0f9ff; border:1px solid #bae6fd; border-radius:10px;
    padding:14px 16px; margin-top:14px;
  }
  .history h4 { font-size:1rem; color:#0369a1; margin-bottom:8px; }
  .history .h-row {
    display:flex; justify-content:space-between; padding:6px 0;
    border-bottom:1px dashed #bae6fd; font-size:.88rem;
  }
  .history .h-row:last-child { border:0; }
  /* ===== WRITING GUIDE ===== */
  .writing-guide {
    background:#fef3c7; border-left:4px solid #f59e0b; padding:12px 14px;
    border-radius:8px; font-size:.92rem; margin:10px 0;
  }
  .writing-guide ul { margin-left:20px; }
</style>
</head>

<script>
/* ========== DATA SLOTS ========== */
var DAYS = [
{n:1, type:'mix', title:'Day 1 — Diagnostic Mock (Math mix + Science clusters)', time:'~90-120 phút · 60 câu', focus:'Buổi chẩn đoán đầu tiên — bám sát format đề 2025-2026: Math (đa số single + 1-2 cụm), Science (chủ yếu cụm passage/figure → câu hỏi liên quan).', items:[
 {kind:'section', text:'PART 1 — MATHEMATICS (30 câu)'},
 {kind:'subsection', text:'Mixed Math Topics (single questions)'},

 {kind:'q', num:2, q:'Solve the simultaneous equations:<br>x + 2y = 10<br>3x − y = 9', a:'x = 4, y = 3', exp:'Từ pt 1: x = 10 − 2y. Thay vào pt 2: 3(10 − 2y) − y = 9 → 30 − 7y = 9 → y = 3, x = 4.', ref:'M.L6 Simultaneous eqs', pts:'0.1đ'},
 {kind:'q', num:3, q:'Bình can buy 24 stickers for $2.50. If the cost is in direct proportion, how much will 300 stickers cost?', a:'$31.25', exp:'1 sticker = 2.50/24 ≈ $0.1042. 300 × $0.1042 = <b>$31.25</b>.', ref:'M.L5 Proportion', pts:'0.1đ'},

 {kind:'q', num:5, q:'Fully factorise: x² − 11x + 24', a:'(x − 3)(x − 8)', exp:'Tích = 24, tổng = −11 → −3 và −8.', ref:'M.L11 Factorise', pts:'0.1đ'},
 {kind:'q', num:6, q:'Expand and simplify: (2x + 5)(x − 3)', a:'2x² − x − 15', exp:'FOIL: 2x² − 6x + 5x − 15 = <b>2x² − x − 15</b>.', ref:'M.L11 Expand', pts:'0.1đ'},
 {kind:'q', num:7, q:'A bank pays compound interest of 2% per year. How much will VND 100,000,000 earn over 3 years?', a:'≈ 6,120,800 VND', exp:'A = 100M × 1.02³ = 106,120,800. Interest = <b>≈ 6,120,800 VND</b>.', ref:'M.L15 Compound', pts:'0.1đ'},
 {kind:'q', num:8, q:'Mai invests $1,200 at simple interest of 4% per year for 5 years. How much interest will she earn?', a:'$240', exp:'SI = P × r × t = 1200 × 0.04 × 5 = <b>$240</b>.', ref:'M.L15 Simple Int', pts:'0.1đ'},
 {kind:'q', num:9, q:'Write an inequality for the statement (use x for number of students): "There are AT LEAST 30 students in the class."', a:'x ≥ 30', exp:'"At least 30" = ≥ 30 (bao gồm 30).', ref:'M.L14 Inequality', pts:'0.1đ'},
 {kind:'q', num:10, q:'Round 0.08296 to 3 significant figures.', a:'0.0830', exp:'Sig figs: 8 (1), 2 (2), 9 (3). Tiếp theo là 6 → làm tròn lên → <b>0.0830</b>.', ref:'M.L2 Sig Figs', pts:'0.1đ'},

 {kind:'subsection', text:'Paired Math Questions — same shape (like exam Q10-11)'},
 {kind:'instruction', text:'Use the three-dimensional shape to answer questions 11 and 12.<br>[A cuboid with dimensions 15 cm × 8 cm × 25 cm.]'},

 {kind:'q', num:12, q:'Calculate the volume of this shape in cm³.', a:'3,000 cm³', exp:'V = 15 × 8 × 25 = <b>3,000 cm³</b>.', ref:'M.L20', pts:'0.1đ'},

 {kind:'instruction', text:'A circular pond has diameter 6 m and depth 1.5 m. Use π ≈ 3.14. (Questions 13 and 14)'},
 {kind:'q', num:13, q:'Calculate the volume of water needed to fill the pond. Give answer in m³ to 1 d.p.', a:'42.4 m³', exp:'r = 3 m. V = πr²h = 3.14 × 9 × 1.5 = <b>42.39 ≈ 42.4 m³</b>.', ref:'M.L20', pts:'0.1đ'},
 {kind:'q', num:14, q:'If 1 m³ = 1,000 litres, how many litres of water are needed?', a:'42,400 litres', exp:'42.4 × 1,000 = <b>42,400 L</b>.', ref:'M.L20', pts:'0.1đ'},

 {kind:'subsection', text:'More Math Topics'},
 {kind:'q', num:15, q:'A line passes through (1, 4) and (5, 16). Find its gradient.', a:'3', exp:'m = (16 − 4)/(5 − 1) = 12/4 = <b>3</b>.', ref:'M.L9 Gradient', pts:'0.1đ'},
 {kind:'q', num:16, q:'In a right-angled triangle, the two shorter sides are 5 cm and 12 cm. Find the hypotenuse.', a:'13 cm', exp:'c² = 25 + 144 = 169 → c = <b>13 cm</b>.', ref:'M.L24 Pythag', pts:'0.1đ'},
 {kind:'q', num:17, q:'A bag has 8 red, 4 blue and 8 green marbles. P(green)?', a:'2/5 (or 8/20)', exp:'8/(8+4+8) = 8/20 = <b>2/5</b>.', ref:'M.L23 Prob', pts:'0.1đ'},

 {kind:'q', num:19, q:'A photo 12 cm × 8 cm is enlarged by scale factor 2.5. Find the new area in cm².', a:'600 cm²', exp:'Original area = 96. Area sf = 2.5² = 6.25. New = 96 × 6.25 = <b>600 cm²</b>.', ref:'M.L17/18', pts:'0.1đ'},
 {kind:'q', num:20, q:'Calculate: (2 × 10⁴) × (3 × 10⁵). Give in standard form.', a:'6 × 10⁹', exp:'2×3=6, 10⁴×10⁵=10⁹ → <b>6 × 10⁹</b>.', ref:'M.L4 Indices', pts:'0.1đ'},

 {kind:'q', num:28, q:'Rotate the point (3, 5) by 90° clockwise about the origin. Find new coordinates.', a:'(5, −3)', exp:'90° clockwise: (x, y) → (y, −x) → <b>(5, −3)</b>.', ref:'M.L17 Trans', pts:'0.1đ'},

 {kind:'section', text:'PART 2 — SCIENCE (30 câu — phần lớn theo cụm passage/figure)'},

 {kind:'instruction', text:'Use the following passage about photosynthesis to answer questions 31, 32 and 33.'},
 {kind:'passage', text:'Photosynthesis is the process by which green plants make food. They absorb carbon dioxide through small pores on the leaves called stomata, and water through their roots. Using sunlight as the energy source and a green pigment called chlorophyll located in chloroplasts, plants convert these into glucose and oxygen. The glucose stores energy for the plant, while oxygen is released into the atmosphere.'},
 {kind:'q', num:31, q:'Name the gas that plants take in during photosynthesis.', a:'Carbon dioxide (CO₂)', exp:'Para nêu: "absorb carbon dioxide".', ref:'S.L10 Bio', pts:'0.2đ'},
 {kind:'q', num:32, q:'Name two products of photosynthesis.', a:'Glucose AND oxygen', exp:'Bài nói rõ 2 sản phẩm.', ref:'S.L10', pts:'0.2đ'},
 {kind:'q', num:33, q:'In which structure of the plant cell does photosynthesis occur?', a:'Chloroplasts', exp:'Bài nói: "chlorophyll located in chloroplasts".', ref:'S.L10', pts:'0.2đ'},

 {kind:'instruction', text:'Figure 1 shows a simple food chain in a rice field. Use it to answer questions 34, 35 and 36.'},
 {kind:'figure', text:'<svg viewBox="0 0 620 180" style="max-width:620px"><defs><marker id="fcAR" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#000"/></marker></defs><rect x="10" y="50" width="100" height="50" fill="#84cc16" stroke="#15803d" stroke-width="2" rx="8"/><text x="60" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Rice plants</text><line x1="115" y1="75" x2="155" y2="75" stroke="#000" stroke-width="2" marker-end="url(#fcAR)"/><rect x="160" y="50" width="120" height="50" fill="#fef08a" stroke="#a16207" stroke-width="2" rx="8"/><text x="220" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Grasshoppers</text><line x1="285" y1="75" x2="325" y2="75" stroke="#000" stroke-width="2" marker-end="url(#fcAR)"/><rect x="330" y="50" width="80" height="50" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" rx="8"/><text x="370" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Frogs</text><line x1="415" y1="75" x2="455" y2="75" stroke="#000" stroke-width="2" marker-end="url(#fcAR)"/><rect x="460" y="50" width="80" height="50" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="8"/><text x="500" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Snakes</text><text x="60" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#eab308">☀ Sunlight</text><line x1="60" y1="30" x2="60" y2="45" stroke="#eab308" stroke-width="1.5" marker-end="url(#fcAR)"/><rect x="200" y="135" width="200" height="32" fill="#fef2f2" stroke="#a16207" stroke-width="1.5" stroke-dasharray="3,2" rx="6"/><text x="300" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic">Bacteria (decomposers)</text></svg>'},
 {kind:'q', num:34, q:'From Figure 1, identify the producer.', a:'Rice plants', exp:'Cây lúa quang hợp → producer.', ref:'S.L23 Ecology', pts:'0.2đ'},
 {kind:'q', num:35, q:'Which trophic level do frogs belong to?', a:'Secondary consumer (tertiary trophic level / level 3)', exp:'Rice (L1) → Grasshopper (L2 primary) → Frog (L3 secondary consumer).', ref:'S.L23', pts:'0.2đ'},
 {kind:'q', num:36, q:'If pesticides kill all the grasshoppers, what happens to the FROG population — increase or decrease?', a:'Decrease', exp:'Frogs ăn grasshoppers (con mồi chính). Mất nguồn thức ăn → frogs đói → số lượng <b>giảm</b>.<br>Đây là nguyên tắc của chuỗi thức ăn: phá huỷ 1 mắt xích → ảnh hưởng cả chuỗi.', ref:'S.L23', pts:'0.2đ'},

 {kind:'instruction', text:'Use the following passage about magnets to answer questions 37, 38 and 39.'},
 {kind:'passage', text:'An electromagnet is created when an electric current flows through a coiled wire wrapped around a soft iron core. Unlike a permanent magnet, an electromagnet can be turned ON and OFF by switching the current. Its strength can be increased by adding more turns of wire, increasing the current, or using a stronger iron core. Electromagnets are used in motors, doorbells, and large scrapyard cranes for lifting iron.'},
 {kind:'q', num:37, q:'What material is used as the core of an electromagnet?', a:'Soft iron', exp:'Para: "soft iron core".', ref:'S.L7 Magnets', pts:'0.2đ'},
 {kind:'q', num:38, q:'Name one way to increase the strength of an electromagnet.', a:'Any: more turns / increase current / stronger iron core', exp:'3 cách trong bài.', ref:'S.L7', pts:'0.2đ'},
 {kind:'q', num:39, q:'Give one advantage of an electromagnet over a permanent magnet.', a:'Can be turned on/off (controlled)', exp:'Permanent magnet luôn có từ tính; electromagnet bật/tắt được.', ref:'S.L7', pts:'0.2đ'},

 {kind:'instruction', text:'A student heats 75 g of magnesium carbonate (MgCO₃). The reaction produces magnesium oxide (MgO) and carbon dioxide gas. After heating, the mass of magnesium oxide remaining is 36 g. (Questions 40 and 41)'},
 {kind:'q', num:40, q:'What is the mass of the carbon dioxide released?', a:'39 g', exp:'Conservation of mass: 75 − 36 = <b>39 g</b>.', ref:'S.L3 Conservation', pts:'0.2đ'},
 {kind:'q', num:41, q:'What is the percentage decrease in solid mass after heating?', a:'52%', exp:'(39 ÷ 75) × 100 = <b>52%</b>.', ref:'S.L3', pts:'0.2đ'},

 {kind:'instruction', text:'Use the following passage about acids and bases to answer questions 42 and 43.'},
 {kind:'passage', text:'Acids have a pH less than 7 and taste sour. Common acids include hydrochloric acid (in stomach acid), citric acid (in lemons), and acetic acid (in vinegar). Bases have a pH greater than 7. When an acid reacts with a base, neutralisation occurs — producing a salt and water. The pH scale runs from 0 (strong acid) to 14 (strong base), with 7 being neutral.'},
 {kind:'q', num:42, q:'What is the pH of a neutral solution?', a:'7', exp:'pH 7 = trung tính.', ref:'S.L15 Acids', pts:'0.2đ'},
 {kind:'q', num:43, q:'Complete the equation: acid + base → ___ + ___', a:'salt + water', exp:'Phản ứng trung hoà tạo <b>salt + water</b>.', ref:'S.L15', pts:'0.2đ'},

 {kind:'instruction', text:'Figure 2 shows the electromagnetic spectrum. Use Figure 2 to answer questions 44, 45 and 46.'},

aves travel at speed of light c = 3 × 10⁸ m/s in vacuum</text></svg>'},
 {kind:'q', num:44, q:'Which type of EM radiation has the HIGHEST frequency?', a:'Gamma rays', exp:'Bên phải spectrum = tần số cao nhất.', ref:'S.L12 Waves', pts:'0.2đ'},
 {kind:'q', num:45, q:'Which type of EM radiation can our eyes detect?', a:'Visible light', exp:'Mắt người chỉ nhìn thấy visible light.', ref:'S.L12', pts:'0.2đ'},
 {kind:'q', num:46, q:'Name one EVERYDAY use of microwaves.', a:'Any: cooking, WiFi, mobile phones, satellite, radar', exp:'Nhiều ứng dụng đời sống.', ref:'S.L12', pts:'0.2đ'},

 {kind:'instruction', text:'A book of mass 1.5 kg sits flat on a table. The area of the cover touching the table is 0.03 m². Use g = 10 N/kg. (Questions 47 and 48)'},
 {kind:'q', num:47, q:'Calculate the weight of the book in newtons (N).', a:'15 N', exp:'W = m × g = 1.5 × 10 = <b>15 N</b>.', ref:'S.L24 Forces', pts:'0.2đ'},
 {kind:'q', num:48, q:'Calculate the pressure on the table. Use P = F ÷ A.', a:'500 Pa', exp:'P = 15 ÷ 0.03 = <b>500 Pa</b>.', ref:'S.L19 Pressure', pts:'0.2đ'},

 {kind:'instruction', text:'Figure 3 shows the structure of an animal cell. Use it to answer questions 49 and 50.'},
 {kind:'figure', text:'<svg viewBox="0 0 420 290" style="max-width:420px"><ellipse cx="210" cy="145" rx="195" ry="130" fill="#fef3c7" stroke="#7c2d12" stroke-width="4"/><circle cx="210" cy="145" r="42" fill="#1e293b" stroke="#000" stroke-width="2"/><ellipse cx="90" cy="80" rx="24" ry="11" fill="#dc2626"/><ellipse cx="330" cy="80" rx="24" ry="11" fill="#dc2626"/><ellipse cx="90" cy="210" rx="24" ry="11" fill="#dc2626"/><ellipse cx="330" cy="210" rx="24" ry="11" fill="#dc2626"/><text x="210" y="151" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">X</text><text x="5" y="20" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c2d12">Y</text><line x1="20" y1="22" x2="32" y2="32" stroke="#000" stroke-width="1"/><text x="60" y="100" font-family="sans-serif" font-size="10" fill="#dc2626">Mitochondria</text><text x="120" y="170" font-family="sans-serif" font-size="11" fill="#7c2d12">Cytoplasm (jelly)</text></svg>'},
 {kind:'q', num:49, q:'Name structure X. What is its main function?', a:'Nucleus — controls the cell / contains DNA',
  exp:'<b>X = Nucleus (nhân tế bào):</b> "trung tâm điều khiển" của tế bào, chứa DNA — vật chất di truyền điều khiển mọi hoạt động sống.<br><br><b>📚 Học luôn các cấu trúc khác trong hình:</b><br>• <b>Mitochondria</b> (hình sausage đỏ): "nhà máy năng lượng", giải phóng năng lượng từ glucose qua hô hấp tế bào: glucose + O₂ → CO₂ + H₂O + năng lượng.<br>• <b>Cytoplasm</b> (chất dịch nhớt bên trong): nơi diễn ra hầu hết phản ứng hoá học của tế bào.<br>• <b>Cell membrane (Y)</b>: lớp ngoài cùng — xem Q50.<br><br><b>So sánh với plant cell:</b> Plant cell có thêm <b>cell wall</b>, <b>chloroplasts</b>, và <b>large vacuole</b> mà animal cell không có.', ref:'S.L4 Cells', pts:'0.2đ'},
 {kind:'q', num:50, q:'Name structure Y. State its function.', a:'Cell membrane — controls what enters and leaves the cell',
  exp:'<b>Y = Cell membrane (màng tế bào):</b> lớp màng mỏng bao quanh tế bào, là <b>màng bán thấm</b> — kiểm soát chất nào ra/vào tế bào (cho oxygen, nước, glucose đi vào; thải CO₂, chất thải ra).<br><br><b>📚 Mở rộng kiến thức:</b><br>• Cell membrane có CẢ ở animal và plant cells.<br>• Plant cell có thêm <b>cell wall</b> (vách tế bào) bên ngoài cell membrane — cell wall cứng để giữ hình dạng cây.<br>• Cell membrane được tạo từ <b>lớp lipid kép</b> (phospholipid bilayer) — nhớ cụm này cho exam B1-B2.<br>• <b>Diffusion</b> (khuếch tán) và <b>osmosis</b> (thẩm thấu) là 2 cách chất đi qua cell membrane mà không cần năng lượng.', ref:'S.L4', pts:'0.2đ'},

 {kind:'instruction', text:'Use the following passage about viruses to answer questions 51 and 52.'},
 {kind:'passage', text:'Viruses are the smallest type of pathogen. They cannot reproduce on their own — they must enter a host cell and use the cell\'s machinery to make copies of themselves. Antibiotics, which fight bacteria, do not work against viruses. Vaccines work by training the immune system to recognise and fight specific viruses before they cause disease.'},
 {kind:'q', num:51, q:'Which type of pathogen do antibiotics NOT work against?', a:'Viruses', exp:'<b>Antibiotics</b> = thuốc kháng sinh, chỉ diệt vi khuẩn (bacteria) bằng cách tấn công vách tế bào hoặc ribosome. <b>Viruses không có những cấu trúc này</b> → antibiotics vô tác dụng.<br><b>📚 Bridge:</b> antibiotics / kháng sinh · virus / vi-rút (cảm cúm, COVID-19...).<br><b>Đối phó virus:</b> dùng vaccines (phòng) + antivirals + để cơ thể tự miễn dịch.', ref:'S.L5 Pathogens', pts:'0.2đ'},
 {kind:'q', num:52, q:'A vaccine contains a weakened or dead pathogen. Which body system does it train?', a:'Immune system', exp:'Vaccine "huấn luyện" <b>immune system</b> nhận diện mầm bệnh. Khi mầm bệnh thật xuất hiện, immune system phản ứng nhanh, tạo antibodies tiêu diệt.<br><b>📚 Quy trình:</b> vaccine → B-cells nhận diện → tạo antibodies + memory cells → bảo vệ lâu dài.', ref:'S.L5', pts:'0.2đ'},

 {kind:'instruction', text:'A car accelerates uniformly from rest to 20 m/s in 8 seconds, then travels at this constant speed for 12 seconds. (Questions 53 and 54)'},
 {kind:'q', num:53, q:'Calculate the car\'s acceleration during the first 8 seconds.', a:'2.5 m/s²', exp:'a = (v − u)/t = (20 − 0)/8 = <b>2.5 m/s²</b>.', ref:'S.L25 Motion', pts:'0.2đ'},
 {kind:'q', num:54, q:'Calculate the total distance travelled in the 20 seconds (acceleration phase + constant phase).', a:'320 m', exp:'Phase 1 (0-8s): avg speed = 10 m/s → 10 × 8 = 80 m. Phase 2 (8-20s): 20 × 12 = 240 m. Tổng = <b>320 m</b>.', ref:'S.L25', pts:'0.2đ'},

 {kind:'instruction', text:'Use the following information about the Solar System to answer questions 55 and 56.'},
 {kind:'passage', text:'The Solar System consists of the Sun and 8 planets that orbit it. The four inner planets (Mercury, Venus, Earth, Mars) are small, rocky planets. The four outer planets (Jupiter, Saturn, Uranus, Neptune) are gas giants. Gravity, which depends on mass, holds the planets in orbit around the Sun. Earth\'s gravitational field strength is g = 10 N/kg.'},
 {kind:'q', num:55, q:'What is the weight on Earth of a 50 kg person?', a:'500 N', exp:'W = 50 × 10 = <b>500 N</b>.', ref:'S.L13 Gravity', pts:'0.2đ'},
 {kind:'q', num:56, q:'Which property of a planet determines the STRENGTH of its gravity?', a:'Mass', exp:'Gravity tỉ lệ thuận với <b>khối lượng (mass)</b> của thiên thể. Jupiter có mass gấp ~318 lần Earth → g lớn hơn nhiều.<br><b>g (gravitational field strength):</b> Earth = 10 N/kg · Moon = 1.6 N/kg · Jupiter ≈ 25 N/kg.<br><b>Bridge:</b> mass / khối lượng (kg) · weight / trọng lượng (N) = mass × g.', ref:'S.L13', pts:'0.2đ'},

 {kind:'subsection', text:'Single Science Questions (4 câu)'},
 {kind:'q', num:57, q:'Element X has 17 protons. Which group of the periodic table does it belong to?', a:'Group 7 (Halogens)', exp:'17 proton → Chlorine → Group 7.', ref:'S.L2 Periodic', pts:'0.2đ'},
 {kind:'q', num:58, q:'Which separation technique would you use to obtain pure water from sea water?', a:'Distillation', exp:'Chưng cất: đun cho nước bay hơi, ngưng tụ lại → nước tinh khiết.', ref:'S.L9 Separation', pts:'0.2đ'},
 {kind:'q', num:59, q:'What is the smallest type of blood vessel?', a:'Capillaries', exp:'<b>Capillaries</b> (mao mạch) — nơi trao đổi chất.', ref:'S.L17 Circulation', pts:'0.2đ'},
 {kind:'q', num:60, q:'Name one type of nutrient that the body needs in very small amounts but is essential for health.', a:'Vitamins or minerals', exp:'<b>Vitamins/minerals</b> — cần lượng nhỏ nhưng thiết yếu (vd vit C, iron, calcium).', ref:'S.L16 Nutrition', pts:'0.2đ'},

 {kind:'section', text:'PART 3 — READING (Wildlife conservation theme)'},
 {kind:'subsection', text:'The Last Saola: A Hidden Treasure'},
 {kind:'passage', text:'<b>A.</b> Deep in the rugged mountains along the border between Vietnam and Laos lives one of the rarest mammals on Earth. The saola — sometimes called "the Asian unicorn" — has two long, straight horns and a beautiful white-marked face. Yet despite living near humans for thousands of years, this remarkable animal was unknown to science until 1992, when scientists found skulls in a Vietnamese village.<br><br><b>B.</b> Physically, the saola is striking. Standing about 85 cm tall at the shoulder, it has a dark brown coat with white spots on its face that look almost painted. Its horns can reach over 50 cm in length and curve gracefully backward. Although the saola lives near humans, it is so shy and elusive that it has rarely been photographed in the wild — fewer than ten times in over thirty years.<br><br><b>C.</b> Conservationists believe there may now be fewer than 100 saolas left in the world — possibly far fewer. The greatest threat is illegal hunting. Most saolas are not hunted directly, but become caught in wire snares set by hunters seeking other animals. These cruel traps catch anything that walks past them, and once trapped, a saola cannot escape.<br><br><b>D.</b> In response to this crisis, local communities, scientists, and international organisations have created the Saola Working Group. Teams of forest rangers patrol the mountains, removing thousands of snares each year. Conservation breeding centres are being prepared, and villages near the saola\'s home are receiving support to develop livelihoods that do not depend on hunting.<br><br><b>E.</b> The saola\'s story is a sad reminder that even our own homeland still hides creatures we hardly know — and that we can lose them before we truly understand them. But it is also a story of hope: the same humans who threatened the saola are now its protectors. Whether this gentle, unique animal survives depends entirely on what we decide to do today.'},
 {kind:'q', num:61, q:'In paragraph A, when was the saola first known to science?', a:'1992', exp:'Para A: "unknown to science until 1992".', ref:'Reading R1', pts:'0.25đ'},
 {kind:'q', num:62, q:'In paragraph B, identify <b>one adjective</b> and <b>one verb</b>.', a:'Adj: striking, dark, white, shy, elusive · Verb: standing, reach, curve, photographed', exp:'Nhiều lựa chọn đúng.', ref:'Reading R2', pts:'0.25đ'},
 {kind:'q', num:63, q:'In paragraph B, the writer says the saola is "elusive". Explain <b>in your own words</b> what "elusive" means in this context.', a:'Hard to find / rarely seen / good at hiding', exp:'<b>Elusive</b> = khó tìm, ít khi thấy được.', ref:'Reading R7', pts:'0.25đ'},
 {kind:'q', num:64, q:'In paragraph C, why does the writer call the snares "cruel"?',
  subq:'<div class="options"><p>A. Because they are expensive.</p><p>B. Because they catch any animal that walks past, including saola.</p><p>C. Because they break easily.</p><p>D. Because they are illegal in Vietnam only.</p></div>',
  a:'B', exp:'Para C: "These cruel traps catch anything that walks past them".', ref:'Reading R3', pts:'0.25đ'},
 {kind:'q', num:65, q:'Give a synonym for "remarkable" as used in paragraph A.', a:'amazing / extraordinary / impressive / outstanding', exp:'<b>Remarkable</b> = đáng kinh ngạc.', ref:'Reading R4', pts:'0.25đ'},
 {kind:'q', num:66, q:'In paragraph D, explain <b>in your own words</b> one specific action being taken to protect the saola.', a:'Câu mở', exp:'<b>Sample:</b> Forest rangers patrol the mountains and remove thousands of wire traps each year, so that fewer saolas get caught.', ref:'Reading R6', pts:'0.25đ'},
 {kind:'q', num:67, q:'T/F/NG:<br>A. The saola lives in the mountains between Vietnam and Laos.<br>B. Vietnamese saolas have always been hunted for their meat.', a:'A: TRUE — B: NOT GIVEN', exp:'A: ✓ Para A. B: bài nói nhiều saola không bị săn trực tiếp; cũng không nói về thịt → NOT GIVEN.', ref:'Reading R5', pts:'0.25đ'},
 {kind:'q', num:68, q:'T/F/NG:<br>A. Fewer than 100 saolas may remain in the world today.<br>B. The Saola Working Group is led by the Vietnamese government.', a:'A: TRUE — B: NOT GIVEN', exp:'A: ✓ Para C. B: bài không nói cụ thể ai dẫn dắt.', ref:'Reading R5', pts:'0.25đ'},

 {kind:'section', text:'PART 4 — WRITING (Wildlife / Community theme)'},
 {kind:'instruction', text:'Imagine your school is planning a campaign to raise awareness about an endangered animal in Vietnam. Write a short proposal suggesting an idea for ONE awareness activity. <b>Write three paragraphs.</b><br>✦ A clear description of your activity idea.<br>✦ Why students would enjoy and join it.<br>✦ How the activity will help protect the animal.<br>Write between <b>100-150 words</b>.'},
 {kind:'q', num:69, q:'Viết bài Writing. Bấm "Xem đáp án" để xem mẫu.', a:'Sample + Rubric',
  exp:'<b>Rubric:</b> Task 0.7 / Org 0.5 / Vocab 0.4 / Grammar 0.4.<br><br><b>Sample (~135 từ):</b><br><em>For our wildlife campaign, I propose a "Save the Saola" Week. Each class would adopt the saola as their mascot for one week. Students would create posters with facts and pictures, then display them around the school. On the final day, classes would host a "Story Café" where they share what they have learned with parents and other students over tea and small snacks.<br><br>Students would enjoy this activity because it combines art, research, and storytelling. Even shy students can contribute by drawing or designing posters. Older students could read their stories aloud, building confidence while teaching others.<br><br>The campaign would help protect the saola in real ways. Awareness brings attention to the problem of illegal snares. Money collected from the Story Café could be donated to a real conservation group — small but real support for one of Vietnam\'s rarest animals.</em>',
  ref:'Writing', pts:'2đ'}
]},

 {kind:'section', text:'PART 1 — MATHEMATICS (30 câu)'},

 {kind:'q', num:2, q:'Estimate (98.6 + 41.7) × 5.2 by rounding to 1 sig fig.', a:'≈ 700', exp:'(100 + 40) × 5 = 140 × 5 = <b>700</b>.', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:3, q:'Estimate 386 × 22 by rounding to 1 sig fig.', a:'≈ 8000', exp:'400 × 20 = <b>8000</b>.', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:4, q:'Estimate 1480 ÷ 28 by rounding to 1 sig fig.', a:'≈ 50', exp:'1500 ÷ 30 = <b>50</b> (chấp nhận 33-50).', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:5, q:'Estimate √48 by rounding to the nearest perfect square.', a:'≈ 7', exp:'48 gần 49 = 7² → √48 ≈ <b>7</b>.', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:6, q:'Estimate (4.95)² by rounding to 1 sig fig.', a:'≈ 25', exp:'5² = <b>25</b>. (Giá trị thật ≈ 24.5)', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:7, q:'Estimate 19.6 × 0.48 by rounding to 1 sig fig.', a:'≈ 10', exp:'20 × 0.5 = <b>10</b>.', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:8, q:'A student calculates 38 × 121 = 4598. Use estimation to check if this is reasonable.', a:'Reasonable', exp:'40 × 100 = 4000. Giá trị 4598 gần với ước lượng → <b>reasonable</b>.', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:9, q:'Estimate 752 ÷ 31 by rounding to 1 sig fig.', a:'≈ 25', exp:'750 ÷ 30 = <b>25</b>.', ref:'M.L1', pts:'0.05đ'},
 {kind:'q', num:10, q:'Estimate (3.95² − 2.1) ÷ 1.9 by rounding to 1 sig fig.', a:'≈ 7', exp:'(16 − 2) ÷ 2 = 14 ÷ 2 = <b>7</b>.', ref:'M.L1', pts:'0.05đ'},

 {kind:'subsection', text:'M.L2 — Significant Figures, Fractions, Decimals (10 câu)'},
 {kind:'q', num:11, q:'Round 0.04738 to 3 significant figures.', a:'0.0474', exp:'Số sig fig đầu là 4. Số thứ 4 là 8 → làm tròn lên: <b>0.0474</b>.', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:12, q:'Round 12.7846 to 2 decimal places.', a:'12.78', exp:'Chữ số thứ 3 sau dấu phẩy là 4 → giữ nguyên: <b>12.78</b>.', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:13, q:'Round 5,768,432 to 2 significant figures.', a:'5,800,000', exp:'Sig fig đầu: 5, thứ 2: 7. Số tiếp theo là 6 → làm tròn lên: <b>5,800,000</b>.', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:14, q:'Calculate: 2/3 + 5/8 − 1/4. Give your answer as a fraction in simplest form.', a:'25/24', exp:'Mẫu chung 24: 16/24 + 15/24 − 6/24 = <b>25/24</b>.', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:15, q:'Calculate: 3/4 × 8/15. Simplest form.', a:'2/5', exp:'(3 × 8) ÷ (4 × 15) = 24/60 = <b>2/5</b>.', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:16, q:'Calculate: 5/6 ÷ 10/9. Simplest form.', a:'3/4', exp:'5/6 × 9/10 = 45/60 = <b>3/4</b>.', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:17, q:'Convert the fraction 5/8 to a decimal.', a:'0.625', exp:'5 ÷ 8 = <b>0.625</b>.', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:18, q:'Convert 0.45 to a fraction in simplest form.', a:'9/20', exp:'0.45 = 45/100 = <b>9/20</b> (chia cả 2 cho 5).', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:19, q:'Order from smallest to largest: 0.45, 1/2, 0.4, 3/7', a:'0.4 < 3/7 < 0.45 < 1/2', exp:'3/7 ≈ 0.4286. Thứ tự: 0.4 < 0.4286 (3/7) < 0.45 < 0.5 (1/2).', ref:'M.L2', pts:'0.05đ'},
 {kind:'q', num:20, q:'Round 0.0992 to 1 significant figure.', a:'0.1', exp:'Sig fig đầu là 9. Số tiếp theo 9 → làm tròn lên: 10 × 10⁻² = <b>0.1</b>.', ref:'M.L2', pts:'0.05đ'},

 {kind:'subsection', text:'M.L3 — Prime Factors, HCF, LCM (10 câu)'},
 {kind:'q', num:21, q:'Write 84 as a product of its prime factors.', a:'2² × 3 × 7', exp:'84 = 2 × 42 = 2 × 2 × 21 = 2 × 2 × 3 × 7 = <b>2² × 3 × 7</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:22, q:'Write 120 as a product of its prime factors.', a:'2³ × 3 × 5', exp:'120 = 2 × 60 = 2 × 2 × 30 = 2³ × 15 = <b>2³ × 3 × 5</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:23, q:'Find the HCF of 48 and 60.', a:'12', exp:'48 = 2⁴×3 · 60 = 2²×3×5. HCF = 2²×3 = <b>12</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:24, q:'Find the HCF of 36 and 90.', a:'18', exp:'36 = 2²×3² · 90 = 2×3²×5. HCF = 2×3² = <b>18</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:25, q:'Find the LCM of 8 and 12.', a:'24', exp:'8 = 2³ · 12 = 2²×3. LCM = 2³×3 = <b>24</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:26, q:'Find the LCM of 6 and 15.', a:'30', exp:'6 = 2×3 · 15 = 3×5. LCM = 2×3×5 = <b>30</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:27, q:'Find both HCF and LCM of 24 and 40.', a:'HCF = 8, LCM = 120', exp:'24 = 2³×3 · 40 = 2³×5. HCF = 2³ = <b>8</b>; LCM = 2³×3×5 = <b>120</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:28, q:'Two bells ring at intervals of 6 and 8 minutes. If they ring together at 9:00 am, when will they next ring together?', a:'9:24 am', exp:'LCM(6, 8) = 24 phút. 9:00 + 24 phút = <b>9:24 am</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:29, q:'Find the HCF of 75 and 105.', a:'15', exp:'75 = 3×5² · 105 = 3×5×7. HCF = 3×5 = <b>15</b>.', ref:'M.L3', pts:'0.05đ'},
 {kind:'q', num:30, q:'Find the LCM of 14 and 21.', a:'42', exp:'14 = 2×7 · 21 = 3×7. LCM = 2×3×7 = <b>42</b>.', ref:'M.L3', pts:'0.05đ'},

 {kind:'section', text:'PART 2 — SCIENCE (30 câu — cluster format theo đề thật)'},

 {kind:'instruction', text:'Use the following passage about scientific enquiry to answer questions 31, 32, 33.'},
 {kind:'passage', text:'Scientists carry out experiments to investigate the world. A good experiment has three types of variable. The variable that the scientist changes on purpose is called the <b>independent variable</b>. The variable that is measured (to see how it responds) is called the <b>dependent variable</b>. All other factors that must be kept the same are called <b>control variables</b>. Without proper controls, the experiment is not a "fair test".'},
 {kind:'q', num:31, q:'What is the name of the variable that the scientist CHANGES on purpose?', a:'Independent variable', exp:'Theo bài: variable thay đổi chủ động = <b>independent variable</b>.', ref:'S.L1', pts:'0.1đ'},
 {kind:'q', num:32, q:'What is the name of the variable that is MEASURED?', a:'Dependent variable', exp:'Theo bài: variable đo = <b>dependent</b>.', ref:'S.L1', pts:'0.1đ'},
 {kind:'q', num:33, q:'In a "fair test", how many variables should be changed at the same time?', a:'Only one (the independent variable)', exp:'Fair test = thí nghiệm công bằng — chỉ thay đổi <b>1 biến độc lập</b>, mọi biến khác phải giữ cố định.<br><b>Vd quang hợp:</b> chỉ thay light intensity; còn temperature, CO₂, nước, lượng cây, thời gian — giữ nguyên.<br><b>Nếu đổi 2 biến cùng lúc:</b> không biết biến nào gây ra thay đổi → kết quả vô nghĩa.', ref:'S.L1', pts:'0.1đ'},

 {kind:'instruction', text:'A student investigates how light intensity affects the rate of photosynthesis in pondweed. (Questions 34, 35, 36)'},
 {kind:'q', num:34, q:'State the INDEPENDENT variable in this experiment.', a:'Light intensity', exp:'Đây là biến mà student chủ động thay đổi.', ref:'S.L1', pts:'0.1đ'},
 {kind:'q', num:35, q:'State a DEPENDENT variable that could be measured.', a:'Rate of photosynthesis (e.g. bubbles of O₂ per minute)', exp:'Đo phản ứng quang hợp.', ref:'S.L1', pts:'0.1đ'},
 {kind:'q', num:36, q:'Name TWO variables that must be controlled (kept the same).', a:'Any 2 of: water temperature, CO₂ level, amount/type of pondweed, time of day', exp:'Control variables giữ cố định.', ref:'S.L1', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about Group 1 metals to answer questions 37, 38, 39.'},
 {kind:'passage', text:'Group 1 of the periodic table contains the <b>alkali metals</b>: lithium (Li), sodium (Na), potassium (K), rubidium (Rb), caesium (Cs), francium (Fr). They are soft, shiny when freshly cut, low density, and react very strongly with water. Each Group 1 metal has exactly ONE electron in its outer shell, which it can easily lose. As you go DOWN the group, the elements become MORE reactive — because the outer electron is farther from the nucleus and easier to lose.'},
 {kind:'q', num:37, q:'How many electrons does each Group 1 metal have in its OUTER shell?', a:'1', exp:'Theo bài: "exactly ONE electron in outer shell".', ref:'S.L2', pts:'0.1đ'},
 {kind:'q', num:38, q:'Going DOWN Group 1 (Li → Na → K → Rb), are the elements MORE or LESS reactive?', a:'More reactive', exp:'Đi xuống Group 1, kim loại càng <b>mạnh hơn</b>. Vì: số lớp electron tăng → e ngoài cùng càng XA hạt nhân → lực hút yếu → dễ mất e → phản ứng mạnh hơn.<br><b>Caesium (Cs)</b> ở dưới rất mạnh, phát nổ khi gặp nước.', ref:'S.L2', pts:'0.1đ'},
 {kind:'q', num:39, q:'Write the word equation for the reaction of sodium with water.', a:'sodium + water → sodium hydroxide + hydrogen', exp:'2Na + 2H₂O → 2NaOH + H₂.', ref:'S.L2', pts:'0.1đ'},
