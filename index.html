 {kind:'figure', text:'<svg viewBox="0 0 700 200" style="max-width:700px"><defs><marker id="fc9AR" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#000"/></marker></defs><rect x="10" y="55" width="100" height="50" fill="#84cc16" stroke="#15803d" stroke-width="2" rx="8"/><text x="60" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Rice plants</text><line x1="115" y1="80" x2="155" y2="80" stroke="#000" stroke-width="2" marker-end="url(#fc9AR)"/><rect x="160" y="55" width="120" height="50" fill="#fef08a" stroke="#a16207" stroke-width="2" rx="8"/><text x="220" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Grasshoppers</text><line x1="285" y1="80" x2="325" y2="80" stroke="#000" stroke-width="2" marker-end="url(#fc9AR)"/><rect x="330" y="55" width="80" height="50" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" rx="8"/><text x="370" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Frogs</text><line x1="415" y1="80" x2="455" y2="80" stroke="#000" stroke-width="2" marker-end="url(#fc9AR)"/><rect x="460" y="55" width="80" height="50" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="8"/><text x="500" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Snakes</text><line x1="545" y1="80" x2="585" y2="80" stroke="#000" stroke-width="2" marker-end="url(#fc9AR)"/><rect x="590" y="55" width="80" height="50" fill="#fecaca" stroke="#dc2626" stroke-width="2" rx="8"/><text x="630" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold">Hawks</text><text x="60" y="35" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#eab308" font-weight="bold">☀ Sunlight</text><line x1="60" y1="38" x2="60" y2="50" stroke="#eab308" stroke-width="2" marker-end="url(#fc9AR)"/><rect x="230" y="135" width="220" height="36" fill="#fef2f2" stroke="#a16207" stroke-width="1.5" stroke-dasharray="3,2" rx="6"/><text x="340" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic">Bacteria + Fungi (decomposers)</text><text x="20" y="195" font-family="sans-serif" font-size="10" font-style="italic" fill="#666">Trophic levels: L1 producer → L2 primary → L3 secondary → L4 tertiary → L5 top predator</text></svg>'},
 {kind:'q', num:37, q:'From Figure 2, identify the PRODUCER.', a:'Rice plants', exp:'Cây lúa quang hợp → producer.', ref:'S.L23', pts:'0.1đ'},
 {kind:'q', num:38, q:'In Figure 2, which trophic level does the FROG occupy?', a:'Secondary consumer (tertiary trophic level)', exp:'Rice (L1) → Grasshopper (L2 primary) → Frog (L3 secondary).', ref:'S.L23', pts:'0.1đ'},
 {kind:'q', num:39, q:'What is the role of bacteria and fungi in this food web?', a:'Decomposers — break down dead organisms, recycle nutrients back to soil', exp:'Vai trò: phân giải, tái chế.', ref:'S.L23', pts:'0.1đ'},

 {kind:'instruction', text:'A farmer sprays pesticide that kills ALL the grasshoppers in his rice field. (Questions 40, 41, 42)'},
 {kind:'q', num:40, q:'If pesticides kill all the grasshoppers, what happens to the FROG population — increase or decrease?', a:'Decrease', exp:'Frogs ăn grasshoppers (con mồi chính) → mất nguồn thức ăn → frogs đói → số <b>giảm</b>.<br>Phá huỷ 1 mắt xích trong food chain → ảnh hưởng cả chuỗi.', ref:'S.L23', pts:'0.1đ'},
 {kind:'q', num:41, q:'In the SHORT TERM after pesticides, will the RICE plants grow BETTER or WORSE?', a:'Better (in short term)', exp:'Ngắn hạn: ít sâu (grasshoppers) ăn → rice plants <b>tốt hơn</b>.<br>Dài hạn: pesticides tích tụ trong đất, làm chết các vi sinh vật có ích, vi khuẩn cố định nitrogen → đất nghèo dần → rice plants xấu đi.', ref:'S.L23', pts:'0.1đ'},
 {kind:'q', num:42, q:'Killing a key species (like grasshoppers) reduces what important property of an ecosystem?', a:'Biodiversity', exp:'<b>Biodiversity</b> (đa dạng sinh học) = số loài và sự đa dạng gen trong hệ sinh thái.<br>Giảm biodiversity → hệ sinh thái dễ tổn thương, khó phục hồi.<br>Vd: pesticide diệt tất cả grasshoppers → frogs (ăn grasshoppers) chết theo → snakes ăn frogs cũng giảm → mất cân bằng cả chuỗi.', ref:'S.L23', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage about energy to answer questions 43, 44, 45.'},
 {kind:'passage', text:'There are many forms of energy: <b>kinetic</b> (movement), <b>gravitational potential</b> (height above ground), <b>thermal</b> (heat), <b>chemical</b> (in fuels and food), <b>electrical, light, sound, nuclear</b>. The <b>Law of Conservation of Energy</b> states that energy cannot be CREATED or DESTROYED, only TRANSFERRED or TRANSFORMED. Key equations: <b>GPE = m × g × h</b>; <b>KE = ½ × m × v²</b>; <b>Work = F × d</b>.'},
 {kind:'q', num:43, q:'State the Law of Conservation of Energy.', a:'Energy cannot be created or destroyed, only transferred or transformed', exp:'Theo bài.', ref:'S.L24', pts:'0.1đ'},
 {kind:'q', num:44, q:'A 2 kg ball is lifted 5 m above the ground. Calculate the GPE (g = 10).', a:'100 J', exp:'GPE = m × g × h = 2 × 10 × 5 = <b>100 J</b>.', ref:'S.L24', pts:'0.1đ'},
 {kind:'q', num:45, q:'A 1000 kg car travels at 20 m/s. Calculate its kinetic energy.', a:'200,000 J (200 kJ)', exp:'KE = ½mv² = 0.5 × 1000 × 400 = <b>200,000 J</b>.', ref:'S.L24', pts:'0.1đ'},

 {kind:'instruction', text:'A ball is dropped from a height of 5 m. Energy transforms during the fall. (Questions 46, 47)'},
 {kind:'q', num:46, q:'What ENERGY TRANSFER happens as the ball falls?', a:'Gravitational potential energy → kinetic energy', exp:'GPE → KE.', ref:'S.L24', pts:'0.1đ'},
 {kind:'q', num:47, q:'When the ball hits the ground, what other forms of energy is the kinetic energy transformed into?', a:'Sound energy + thermal (heat) energy', exp:'KE → âm thanh + nhiệt khi va đất.', ref:'S.L24', pts:'0.1đ'},

 {kind:'instruction', text:'Use the following passage on motion to answer questions 48, 49, 50.'},
 {kind:'passage', text:'<b>Speed</b> tells us how fast something moves (e.g. 30 m/s). <b>Velocity</b> is speed in a specific direction (e.g. 30 m/s north) — it is a vector quantity. <b>Acceleration</b> is the rate of change of velocity, calculated as <b>a = (v − u) ÷ t</b>. On a <b>distance-time graph</b>, the gradient gives speed: a steep line means high speed, a horizontal line means stationary. On a <b>speed-time graph</b>, the gradient gives acceleration.'},
 {kind:'q', num:48, q:'What is the DIFFERENCE between speed and velocity?', a:'Speed has only magnitude (scalar); velocity has magnitude AND direction (vector)', exp:'Speed = scalar; velocity = vector.', ref:'S.L25', pts:'0.1đ'},
 {kind:'q', num:49, q:'A train accelerates from 0 to 30 m/s in 10 seconds. Calculate the acceleration.', a:'3 m/s²', exp:'a = (30 − 0)/10 = <b>3 m/s²</b>.', ref:'S.L25', pts:'0.1đ'},
 {kind:'q', num:50, q:'On a distance-time graph, what does a STEEP LINE indicate?', a:'High speed (fast-moving object)', exp:'Gradient = speed.', ref:'S.L25', pts:'0.1đ'},

 {kind:'instruction', text:'Figure 3 shows a distance-time graph for a cyclist\'s journey, with 3 segments: A (steep upward line, 0-2 min), B (flat horizontal, 2-4 min), C (less steep upward, 4-8 min). (Questions 51, 52)'},
 {kind:'figure', text:'<svg viewBox="0 0 460 290" style="max-width:460px"><line x1="60" y1="240" x2="430" y2="240" stroke="#000" stroke-width="2"/><polygon points="430,240 422,236 422,244" fill="#000"/><text x="395" y="265" font-family="sans-serif" font-size="12" font-weight="bold">Time (min)</text><line x1="60" y1="240" x2="60" y2="30" stroke="#000" stroke-width="2"/><polygon points="60,30 56,38 64,38" fill="#000"/><text x="10" y="40" font-family="sans-serif" font-size="12" font-weight="bold">Distance</text><line x1="60" y1="240" x2="160" y2="100" stroke="#dc2626" stroke-width="3"/><text x="105" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">A</text><line x1="160" y1="100" x2="240" y2="100" stroke="#2563eb" stroke-width="3"/><text x="200" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">B</text><line x1="240" y1="100" x2="400" y2="50" stroke="#16a34a" stroke-width="3"/><text x="320" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">C</text><line x1="60" y1="245" x2="60" y2="250" stroke="#000"/><text x="60" y="262" text-anchor="middle" font-family="sans-serif" font-size="10">0</text><line x1="160" y1="245" x2="160" y2="250" stroke="#000"/><text x="160" y="262" text-anchor="middle" font-family="sans-serif" font-size="10">2</text><line x1="240" y1="245" x2="240" y2="250" stroke="#000"/><text x="240" y="262" text-anchor="middle" font-family="sans-serif" font-size="10">4</text><line x1="400" y1="245" x2="400" y2="250" stroke="#000"/><text x="400" y="262" text-anchor="middle" font-family="sans-serif" font-size="10">8</text></svg>'},
 {kind:'q', num:51, q:'In which segment was the cyclist moving FASTEST?', a:'Segment A (steepest line)', exp:'Dốc nhất = nhanh nhất.', ref:'S.L25', pts:'0.1đ'},
 {kind:'q', num:52, q:'What was the cyclist doing in segment B?', a:'Stationary / not moving (resting)', exp:'Horizontal line = đứng yên.', ref:'S.L25', pts:'0.1đ'},

 {kind:'instruction', text:'A bus of mass 5000 kg accelerates at 2 m/s² along a straight road. (Questions 53, 54)'},
 {kind:'q', num:53, q:'Calculate the resultant force on the bus.', a:'10,000 N (10 kN)', exp:'F = ma = 5000 × 2 = <b>10,000 N</b>.', ref:'S.L25', pts:'0.1đ'},
 {kind:'q', num:54, q:'If the same force was applied to a smaller car of mass 1000 kg, what would its acceleration be?', a:'10 m/s²', exp:'a = F/m = 10,000/1000 = <b>10 m/s²</b>.', ref:'S.L24', pts:'0.1đ'},

 {kind:'instruction', text:'(Questions 55-60) Mixed single questions on Earth/Eco/Energy/Motion.'},
 {kind:'q', num:55, q:'What type of harmful RADIATION does the ozone layer absorb from the Sun?', a:'UV (ultraviolet) radiation', exp:'<b>Ozone layer</b> ở tầng stratosphere (10-50 km cao), chứa O₃. Hấp thụ <b>UV radiation</b> độc hại.<br><b>Tầm quan trọng:</b> bảo vệ DNA, mắt; không có ozone → tất cả sinh vật trên cạn sẽ chết.<br><b>Lỗ ozone:</b> CFCs (chlorofluorocarbons từ tủ lạnh cũ) phá huỷ ozone → đã cấm theo Montreal Protocol 1987.', ref:'S.L22', pts:'0.1đ'},
 {kind:'q', num:56, q:'What is "biodiversity"?', a:'The variety of different species in an ecosystem', exp:'Đa dạng sinh học.', ref:'S.L23', pts:'0.1đ'},
 {kind:'q', num:57, q:'Approximately what PERCENTAGE of energy is LOST going up one trophic level?', a:'90% (only ~10% transferred)', exp:'Chỉ <b>~10%</b> năng lượng chuyển lên cấp trên — <b>~90% mất</b>:<br>• Heat từ respiration (hô hấp).<br>• Energy cho vận động, growth.<br>• Các phần không ăn được (xương, vỏ).<br>• Chất thải.<br>Vì vậy food chains ít có hơn 4-5 cấp → không đủ năng lượng cho cấp 6.', ref:'S.L23', pts:'0.1đ'},
 {kind:'q', num:58, q:'A force of 50 N moves a box 10 m. Calculate the work done.', a:'500 J', exp:'W = F × d = 50 × 10 = <b>500 J</b>.', ref:'S.L24', pts:'0.1đ'},
 {kind:'q', num:59, q:'A cyclist travels 4 km in 12 minutes. Calculate her average speed in km/h.', a:'20 km/h', exp:'12 min = 0.2 h. 4/0.2 = <b>20 km/h</b>.', ref:'S.L25', pts:'0.1đ'},
 {kind:'q', num:60, q:'Name THREE forms of energy.', a:'Any 3: kinetic, gravitational potential, thermal, chemical, light, sound, electrical, nuclear', exp:'Nhiều dạng năng lượng.', ref:'S.L24', pts:'0.1đ'},

 {kind:'section', text:'PART 3 — READING (Environment/Future theme)'},
 {kind:'subsection', text:'The Ocean That Saves Us Twice'},
 {kind:'passage', text:'<b>A.</b> When most people think of forests, they picture tall trees, leaves rustling in the wind, and animals moving through the shadows. But the most important "forest" on Earth is one that almost no one can see — it lies beneath the waves. The oceans absorb almost a third of all the carbon dioxide humans release, and they produce more than half of the oxygen we breathe.<br><br><b>B.</b> The hero of this story is a microscopic plant called phytoplankton. Floating in vast clouds across the world\'s oceans, phytoplankton perform photosynthesis exactly like land plants do. They drink in carbon dioxide, soak up sunlight, and release oxygen — but they do it on a scale we struggle to imagine. Every second breath you take comes from the sea.<br><br><b>C.</b> Beyond providing oxygen, oceans also act as the planet\'s temperature regulator. They absorb enormous amounts of heat from the sun, slowing down climate change. They drive the wind systems and rainfall that allow farming. They are home to a million species, many still undiscovered, that form the foundation of countless food chains.<br><br><b>D.</b> But the ocean is in trouble. Pollution, plastic, overfishing, and rising temperatures are damaging the marine ecosystems that have supported life for millions of years. Corals are bleaching white and dying. Fish populations are collapsing in many regions. The phytoplankton themselves are under threat as oceans warm and grow more acidic.<br><br><b>E.</b> Protecting the ocean is not optional — it is one of the most important challenges of our generation. Every plastic bottle we recycle, every meal of sustainable seafood we choose, every voice we add to the call for cleaner industry, matters. The ocean has saved humanity many times. Now it is our turn to save it.'},
 {kind:'q', num:61, q:'In paragraph A, how much of the world\'s oxygen do the oceans produce?', a:'More than half (over 50%)', exp:'Para A: "more than half of the oxygen we breathe".', ref:'Reading R1', pts:'0.25đ'},
 {kind:'q', num:62, q:'In paragraph B, identify <b>one adjective</b> and <b>one verb</b>.', a:'Adj: microscopic, vast, every · Verb: floating, perform, drink, soak, release', exp:'Nhiều lựa chọn đúng.', ref:'Reading R2', pts:'0.25đ'},
 {kind:'q', num:63, q:'In paragraph A, the writer calls the ocean a "forest". Explain <b>in your own words</b> what the writer means by this comparison.', a:'Câu mở', exp:'<b>Sample:</b> The writer compares the ocean to a forest because both produce oxygen and absorb carbon dioxide on a huge scale.', ref:'Reading R7', pts:'0.25đ'},
 {kind:'q', num:64, q:'In paragraph C, why does the writer mention farming and wind systems?',
  subq:'<div class="options"><p>A. To show oceans are noisy places.</p><p>B. To show that oceans affect life far beyond the sea itself.</p><p>C. To prove farming is bad for the ocean.</p><p>D. To explain how to grow rice.</p></div>',
  a:'B', exp:'Para C: oceans drive wind + rain → ảnh hưởng cả farming trên đất liền.', ref:'Reading R3', pts:'0.25đ'},
 {kind:'q', num:65, q:'Give a synonym for "vast" as used in paragraph B.', a:'huge / enormous / immense / great', exp:'<b>Vast</b> = rộng lớn.', ref:'Reading R4', pts:'0.25đ'},
 {kind:'q', num:66, q:'In paragraph E, explain <b>in your own words</b> one specific action people can take to help protect the ocean.', a:'Câu mở', exp:'<b>Sample:</b> Recycle plastic bottles instead of throwing them in the rubbish, where they can end up in the sea.', ref:'Reading R6', pts:'0.25đ'},
 {kind:'q', num:67, q:'T/F/NG:<br>A. Phytoplankton perform photosynthesis.<br>B. Vietnam\'s oceans produce more oxygen than any other country\'s.', a:'A: TRUE — B: NOT GIVEN', exp:'A: Para B ✓. B: bài không so sánh các nước.', ref:'Reading R5', pts:'0.25đ'},
 {kind:'q', num:68, q:'T/F/NG:<br>A. Corals are described in the text as bleaching and dying.<br>B. The text says all fish in the ocean have already gone extinct.', a:'A: TRUE — B: FALSE', exp:'A: Para D ✓. B: chỉ nói "collapsing in many regions" — chưa tuyệt chủng tất cả.', ref:'Reading R5', pts:'0.25đ'},

 {kind:'section', text:'PART 4 — WRITING (Future/Argue theme)'},
 {kind:'instruction', text:'Imagine your city is considering whether to BAN single-use plastic bags in all supermarkets. Some shop owners think this would hurt their business. Write a proposal arguing FOR the ban. <b>Three paragraphs.</b><br>✦ Your position with one strong reason.<br>✦ A second strong reason.<br>✦ Respond to shop owners\' worries.<br>Write <b>100-150 words</b>.'},
 {kind:'q', num:69, q:'Viết bài Writing. Bấm "Xem đáp án" để xem mẫu.', a:'Sample + Rubric',
  exp:'<b>Sample (~130 từ):</b><br><em>Our city should ban single-use plastic bags in all supermarkets. The environmental damage of these bags far outweighs the small convenience they provide. Every year, millions enter rivers and oceans, harming wildlife and breaking into microplastics that even reach our drinking water.<br><br>A second reason is health. Microplastics have now been found in human blood and lungs. By cutting plastic at the source — the supermarket — we reduce the volume entering nature and our own bodies. The change would also push the city to adopt reusable cloth bags, which are now cheap and durable.<br><br>I understand shop owners worry about extra costs and customer complaints. The city could help by providing cheap reusable bags during the transition. After a few weeks, customers adapt — as they have in many other countries. The ban protects both nature and future generations.</em>',
  ref:'Writing', pts:'2đ'}
]},

 focus:'<b>Đề mock bám 100% format 2025-2026.</b> Bấm giờ thật. Nếu không đủ 2 tiếng → chia 2 buổi: Section I (60\') + Section II (60\').',

 {kind:'section', text:'(I) TOÁN VÀ KHOA HỌC — 6 điểm'},
 {kind:'subsection', text:'MATHEMATICS (Q1-Q15)'},
 {kind:'q', num:1, q:'What is the value of angle x?<br>[A triangle with two angles 72° and 92°.]', a:'16°', exp:'180 − 72 − 92 = <b>16°</b>.', ref:'M.L19', pts:'0.2đ'},
 {kind:'q', num:2, q:'Solve the simultaneous equations:<br>2x + 3y = 13<br>x − y = 1', a:'x = 3.2, y = 2.2', exp:'Từ pt 2: x = y+1. Thay: 2(y+1)+3y=13 → 5y=11 → y=2.2, x=3.2.', ref:'M.L6', pts:'0.2đ'},
 {kind:'q', num:3, q:'Tracy buys 18 pens for $4.50. How much will 60 pens cost (direct proportion)?', a:'$15', exp:'1 pen = $0.25. 60 × $0.25 = <b>$15</b>.', ref:'M.L5', pts:'0.2đ'},
 {kind:'q', num:4, q:'A laptop used to cost VND 18,500,000. Now sells for VND 16,650,000. Percentage discount?', a:'10%', exp:'(1,850,000 / 18,500,000) × 100 = <b>10%</b>.', ref:'M.L15', pts:'0.2đ'},
 {kind:'q', num:5, q:'Cường fills a cylindrical tank — diameter 4 m, depth 2 m. Volume in m³ (π ≈ 3.14, 1 d.p.)?', a:'25.1 m³', exp:'V = π × 2² × 2 = <b>25.1 m³</b>.', ref:'M.L20', pts:'0.2đ'},
 {kind:'q', num:6, q:'Fully factorise: x² − 9x + 14', a:'(x − 2)(x − 7)', exp:'Tích = 14, tổng = −9 → −2 và −7.', ref:'M.L11', pts:'0.2đ'},
 {kind:'q', num:7, q:'VND 400,000,000 deposit, 3 years, compound interest 1.5%/year. Interest earned?', a:'≈ 18,271,000 VND', exp:'A = 400M × 1.015³ ≈ 418.27M → lãi ≈ <b>18.27M VND</b>.', ref:'M.L15', pts:'0.2đ'},
 {kind:'q', num:8, q:'$400 deposit, 10 years, simple interest 2.5%. Interest earned?', a:'$100', exp:'SI = 400 × 0.025 × 10 = <b>$100</b>.', ref:'M.L15', pts:'0.2đ'},
 {kind:'q', num:9, q:'Write an inequality: "Hùng has AT LEAST 12 books." (use x)', a:'x ≥ 12', exp:'"At least" → ≥.', ref:'M.L14', pts:'0.2đ'},
 {kind:'q', num:10, q:'Name the 3D shape with dimensions 30 × 15 × 80 cm.', a:'Cuboid', exp:'3 chiều khác nhau → <b>cuboid</b>.', ref:'M.L20', pts:'0.2đ'},
 {kind:'q', num:11, q:'Calculate the volume of the cuboid in Q10 (in cm³).', a:'36,000 cm³', exp:'30 × 15 × 80 = <b>36,000 cm³</b>.', ref:'M.L20', pts:'0.2đ'},
 {kind:'q', num:12, q:'Expand and simplify: (3x − 2)(x + 4)', a:'3x² + 10x − 8', exp:'FOIL: 3x² + 12x − 2x − 8 = <b>3x² + 10x − 8</b>.', ref:'M.L11', pts:'0.2đ'},
 {kind:'q', num:13, q:'A circle has a straight line drawn from the centre to a point on the edge. What is this line called?', a:'Radius', exp:'<b>Radius</b> (bán kính).', ref:'M.L22', pts:'0.2đ'},
 {kind:'q', num:14, q:'A square has sides 6 cm. Enlarged by scale factor 2. Find the new AREA in cm².', a:'144 cm²', exp:'Area sf = 2² = 4. 36 × 4 = <b>144 cm²</b>.', ref:'M.L17/18', pts:'0.2đ'},
 {kind:'q', num:15, q:'Round 12.7846 to 2 decimal places.', a:'12.78', exp:'Số thứ 3 là 4 → giữ nguyên: <b>12.78</b>.', ref:'M.L2', pts:'0.2đ'},

 {kind:'subsection', text:'SCIENCE (Q16-Q30)'},
 {kind:'instruction', text:'Use the passage about Earth\'s atmosphere to answer Q16-18.'},
 {kind:'passage', text:'The Earth\'s atmosphere is mostly nitrogen (78%) and oxygen (21%). Small amounts of CO₂, water vapour, and methane are "greenhouse gases", which trap heat and keep Earth warm. Since the Industrial Revolution, burning fossil fuels has increased greenhouse gas levels, leading to climate change.'},
 {kind:'q', num:16, q:'What percentage of the atmosphere is oxygen?', a:'21%', exp:'Theo đoạn văn.', ref:'S.L22', pts:'0.2đ'},
 {kind:'q', num:17, q:'Name one greenhouse gas (other than water vapour).', a:'Carbon dioxide (CO₂) OR methane (CH₄)', exp:'2 chọn lựa từ bài.', ref:'S.L22', pts:'0.2đ'},
 {kind:'q', num:18, q:'What is the main human activity increasing greenhouse gases?', a:'Burning fossil fuels', exp:'Đoạn văn nói rõ.', ref:'S.L22', pts:'0.2đ'},

 {kind:'instruction', text:'Use the passage about electromagnets to answer Q19-21.'},
 {kind:'passage', text:'An electromagnet is created when an electric current flows through a coiled wire wrapped around a soft iron core. Unlike a permanent magnet, it can be turned ON/OFF by switching the current. Its strength can be increased by adding more turns of wire, increasing current, or using a stronger iron core.'},

/* ===== STORAGE ===== */
var STORE_PREFIX = 'btdd_v2_';
function storageKey(n) { return STORE_PREFIX + 'day' + n; }
function getDayData(n) {
  try { return JSON.parse(localStorage.getItem(storageKey(n))) || {answers:{}, history:[]}; }
  catch(e) { return {answers:{}, history:[]}; }
}
function saveDayData(n, data) { localStorage.setItem(storageKey(n), JSON.stringify(data)); }

/* ===== ANSWER CHECKING ===== */
function stripHtml(s) { return String(s).replace(/<[^>]+>/g, ''); }
function norm(s) {
  return stripHtml(s).toLowerCase()
    .replace(/[,.;:!?'"`*[\]\\()]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function checkAnswerMatch(userInput, correctAnswer) {
  if (!userInput || !String(userInput).trim()) return null;
  var u = norm(userInput);
  var c = norm(correctAnswer);

  // Open-ended / manual review
  if (c.indexOf('câu mở') >= 0 || c.indexOf('sample') >= 0 || c.indexOf('rubric') >= 0) {
    return 'manual';
  }

  // Exact match
  if (u === c) return 'correct';

  // Numeric: compare numbers with 2% tolerance
  var numU = u.match(/-?\d+\.?\d*/);
  var numC = c.match(/-?\d+\.?\d*/);
  if (numU && numC) {
    var diff = Math.abs(parseFloat(numU[0]) - parseFloat(numC[0]));
    var ratio = parseFloat(numC[0]) !== 0 ? diff/Math.abs(parseFloat(numC[0])) : diff;
    if (diff < 0.15 || ratio < 0.03) {
      // Also check non-numeric part matches (e.g. units)
      return 'correct';
    }
  }

  // "Any of:" or "Any N of:"
  if (c.match(/^any\b/) || c.indexOf(' any ') >= 0) {
    var afterColon = c.split(':');
    if (afterColon.length > 1) {
      var optStr = afterColon.slice(1).join(':');
      var options = optStr.split(/[,;]|\bor\b|\band\b/);
      var matched = 0;
      for (var i=0; i<options.length; i++) {
        var key = options[i].replace(/\(.*?\)/g, '').trim();
        if (key.length >= 3) {
          var keyShort = key.split(' ')[0];
          if (keyShort.length >= 3 && u.indexOf(keyShort) >= 0) matched++;
        }
      }
      var needMatch = c.match(/any\s*(\d+)/);
      var needed = needMatch ? parseInt(needMatch[1]) : 1;
      if (matched >= needed) return 'correct';
      if (matched > 0) return 'partial';
      return 'incorrect';
    }
  }

  // Check if user has main keywords (first few words of answer)
  var mainPart = c.split(/[\(—–]/)[0].trim();
  var mainWords = mainPart.split(/\s+/).filter(function(w){ return w.length >= 3; });
  if (mainWords.length > 0) {
    var firstKey = mainWords[0];
    if (u.indexOf(firstKey) >= 0) return 'correct';
  }

  // Reverse contains
  if (u.length >= 3 && c.indexOf(u) >= 0) return 'correct';
  if (mainPart.length >= 3 && u.indexOf(mainPart) >= 0) return 'correct';

  return 'incorrect';
}

/* ===== WORD COUNTER ===== */
function countWords(text) { return (text.trim().match(/\S+/g) || []).length; }
function updateWordCount(taId, dId) {
  var ta = document.getElementById(taId), d = document.getElementById(dId);
  if (!ta || !d) return;
  var cnt = countWords(ta.value);
  d.textContent = cnt + ' từ' + (cnt >= 100 && cnt <= 150 ? ' ✓' : cnt > 150 ? ' (quá nhiều)' : cnt > 0 ? ' (chưa đủ)' : '');
  d.className = 'word-counter ' + (cnt >= 100 && cnt <= 150 ? 'in-range' : cnt > 0 ? 'out-range' : '');
}

/* ===== RENDER ITEM ===== */
function itemHTML(item, dayN, savedAnswers) {
  if(item.kind === 'section') return '<div class="section-h">'+item.text+'</div>';
  if(item.kind === 'subsection') return '<div class="subsec-h">'+item.text+'</div>';
  if(item.kind === 'instruction') return '<div class="instruction">'+item.text+'</div>';
  if(item.kind === 'passage') return '<div class="passage">'+item.text+'</div>';
  if(item.kind === 'figure') {
    var isSvg = item.text.indexOf('<svg') === 0;
    var cls = isSvg ? 'svg-figure' : 'figure';
    var lbl = isSvg ? '📊 HÌNH MINH HOẠ:' : '📊 HÌNH MINH HOẠ — mô tả bằng chữ. Đọc kỹ phần dưới để biết các nhãn:';
    return '<div class="'+cls+'"><span class="figure-label">'+lbl+'</span>'+item.text+'</div>';
  }

  if(item.kind === 'q') {
    var qid = 'q-d'+dayN+'-'+item.num;
    var saved = (savedAnswers && savedAnswers[item.num]) || {};
    // Writing detection: strict — pts must equal '2đ' or '2.0đ' (not 0.2đ!)
    var isWriting = (item.pts === '2đ' || item.pts === '2.0đ');
    var savedClass = saved.result === 'correct' ? ' correct' :
                     saved.result === 'incorrect' ? ' incorrect' :
                     saved.result === 'manual' ? ' manual' : '';

    var h = '<div class="q-card" id="card-'+qid+'">';
    h += '<div class="q-head"><div class="q-num">'+item.num+'</div>';
    h += '<div class="q-text">'+item.q;
    if(item.subq) h += item.subq;
    h += '<div class="q-meta">'+item.ref+' · '+item.pts+'</div>';
    h += '</div></div>';

    if (isWriting) {
      h += '<div class="writing-guide"><b>📝 Hướng dẫn viết:</b><ul>' +
           '<li>3 đoạn — mỗi đoạn cover 1 gạch đầu dòng của đề.</li>' +
           '<li>100-150 từ tổng.</li>' +
           '<li>Dùng các từ nối: <i>firstly, secondly, in addition, however, finally</i>.</li>' +
           '<li>Đoạn đầu giới thiệu ý tưởng; đoạn 2 giải thích lý do; đoạn 3 nói tác dụng/kết quả.</li>' +
           '</ul></div>';
      h += '<textarea class="writing-area" id="ans-'+qid+'" placeholder="Viết bài essay 100-150 từ ở đây..." oninput="updateWordCount(\'ans-'+qid+'\', \'wc-'+qid+'\')">' + (saved.input || '') + '</textarea>';
      h += '<div class="word-counter" id="wc-'+qid+'">0 từ</div>';
      h += '<button class="check-btn" onclick="checkWriting(\''+qid+'\', '+dayN+', '+item.num+')">📤 Nộp bài & Xem bài mẫu</button>';
    } else {
      h += '<textarea class="answer-input'+savedClass+'" id="ans-'+qid+'" rows="2" placeholder="Nhập đáp án...">' + (saved.input || '') + '</textarea>';
      h += '<button class="check-btn" onclick="checkAnswer(\''+qid+'\', '+dayN+', '+item.num+')">✓ Kiểm tra</button>';
      h += '<span class="result-icon ' + (saved.result || '') + '" id="ric-'+qid+'">' +
           (saved.result === 'correct' ? '✓' : saved.result === 'incorrect' ? '✗' :
            saved.result === 'manual' || saved.result === 'partial' ? '?' : '') + '</span>';
    }

    var initialShown = saved.result ? ' show' : '';
    h += '<div class="answer-panel'+initialShown+'" id="'+qid+'">';
    h += '<div class="ans-line"><b>✓ Đáp án:</b> <span class="ans-correct">'+item.a+'</span></div>';
    h += '<div class="ans-line ans-exp"><b>📖 Giải thích & Kiến thức:</b> '+item.exp+'</div>';
    if (!isWriting) {
      h += '<div class="manual-mark"><span>Tự đánh giá (nếu auto-check chưa đúng): </span>' +
           '<button class="mini-btn' + (saved.result === 'correct' ? ' active-correct' : '') + '" onclick="setManualResult(\''+qid+'\', '+dayN+', '+item.num+', \'correct\')">✓ Đúng</button>' +
           '<button class="mini-btn' + (saved.result === 'incorrect' ? ' active-incorrect' : '') + '" onclick="setManualResult(\''+qid+'\', '+dayN+', '+item.num+', \'incorrect\')">✗ Sai</button>' +
           '</div>';
    } else {
      h += '<div class="manual-mark"><span>Tự đánh giá bài viết theo rubric (0-2đ): </span>' +
           '<button class="mini-btn" onclick="setManualScore(\''+qid+'\', '+dayN+', '+item.num+', 2.0)">2.0đ</button>' +
           '<button class="mini-btn" onclick="setManualScore(\''+qid+'\', '+dayN+', '+item.num+', 1.5)">1.5đ</button>' +
           '<button class="mini-btn" onclick="setManualScore(\''+qid+'\', '+dayN+', '+item.num+', 1.0)">1.0đ</button>' +
           '<button class="mini-btn" onclick="setManualScore(\''+qid+'\', '+dayN+', '+item.num+', 0.5)">0.5đ</button>' +
           '</div>';
    }
    h += '<div class="ans-ref">📚 '+item.ref+'</div>';
    h += '</div></div>';
    return h;
  }
  return '';
}

/* ===== CHECK ANSWER ===== */
function checkAnswer(qid, dayN, qNum) {
  var taEl = document.getElementById('ans-'+qid);
  var iconEl = document.getElementById('ric-'+qid);
  var panelEl = document.getElementById(qid);
  if (!taEl) return;
  var userInput = taEl.value;

  var item = null;
  DAYS[dayN-1].items.forEach(function(it){ if(it.kind==='q' && it.num===qNum) item = it; });
  if (!item) return;

  var result = checkAnswerMatch(userInput, item.a);

  taEl.classList.remove('correct', 'incorrect', 'manual');
  if (result === 'correct' || result === 'partial') {
    taEl.classList.add('correct');
    if (iconEl) { iconEl.textContent = result === 'partial' ? '~' : '✓'; iconEl.className = 'result-icon ' + result; }
  } else if (result === 'incorrect') {
    taEl.classList.add('incorrect');
    if (iconEl) { iconEl.textContent = '✗'; iconEl.className = 'result-icon incorrect'; }
  } else if (result === 'manual') {
    taEl.classList.add('manual');
    if (iconEl) { iconEl.textContent = '?'; iconEl.className = 'result-icon manual'; }
  }
  if (panelEl) panelEl.classList.add('show');
  saveAnswer(dayN, qNum, userInput, result);
  updateScore(dayN);
}

function setManualResult(qid, dayN, qNum, result) {
  var taEl = document.getElementById('ans-'+qid);
  var iconEl = document.getElementById('ric-'+qid);
  if (taEl) {
    taEl.classList.remove('correct', 'incorrect', 'manual');
    taEl.classList.add(result);
  }
  if (iconEl) {
    iconEl.textContent = result === 'correct' ? '✓' : '✗';
    iconEl.className = 'result-icon ' + result;
  }
  saveAnswer(dayN, qNum, taEl ? taEl.value : '', result);
  // Update button styles
  var card = document.getElementById('card-'+qid);
  var btns = card ? card.parentElement.querySelectorAll('.mini-btn') : [];
  for (var i=0; i<btns.length; i++) btns[i].classList.remove('active-correct', 'active-incorrect');
  // find button just clicked - via event would be cleaner but this works
  renderDay(dayN);
}

function setManualScore(qid, dayN, qNum, score) {
  var taEl = document.getElementById('ans-'+qid);
  saveAnswer(dayN, qNum, taEl ? taEl.value : '', 'manual_writing', score);
  updateScore(dayN);
  alert('Đã ghi nhận: ' + score + 'đ cho bài Writing.');
}

function checkWriting(qid, dayN, qNum) {
  var taEl = document.getElementById('ans-'+qid);
  var panelEl = document.getElementById(qid);
  if (!taEl) return;
  var userInput = taEl.value;
  var wc = countWords(userInput);
  if (panelEl) panelEl.classList.add('show');
  saveAnswer(dayN, qNum, userInput, 'manual');
  updateScore(dayN);
  setTimeout(function(){
    alert('Bài viết: ' + wc + ' từ.\n\n' +
      (wc >= 100 && wc <= 150 ? '✓ Số từ trong khoảng cho phép.' :
       wc === 0 ? '⚠️ Chưa viết.' :
       wc < 100 ? '⚠️ Cần thêm ' + (100-wc) + ' từ.' :
       '⚠️ Cần bớt ' + (wc-150) + ' từ.') +
      '\n\nXem rubric + bài mẫu phía dưới. Tự chấm theo các nút điểm.');
  }, 100);
}

/* ===== SAVE/LOAD ===== */
function saveAnswer(dayN, qNum, input, result, score) {
  var data = getDayData(dayN);
  if (!data.answers) data.answers = {};
  data.answers[qNum] = {input: input, result: result, t: Date.now()};
  if (score !== undefined) data.answers[qNum].score = score;
  saveDayData(dayN, data);
}

function getDayScore(dayN) {
  var data = getDayData(dayN);
  var items = DAYS[dayN-1].items.filter(function(it){return it.kind==='q';});
  var totalPoints = 0, earned = 0;
  var correct = 0, incorrect = 0, manual = 0, blank = 0;
  items.forEach(function(it){
    var pts = parseFloat((it.pts||'0').replace(/[^\d.]/g, '')) || 0;
    totalPoints += pts;
    var a = data.answers && data.answers[it.num];
    if (!a) { blank++; return; }
    if (a.result === 'correct') { earned += pts; correct++; }
    else if (a.result === 'partial') { earned += pts * 0.5; correct++; }
    else if (a.result === 'incorrect') { incorrect++; }
    else if (a.result === 'manual_writing' && typeof a.score === 'number') { earned += a.score; manual++; }
    else if (a.result === 'manual') { manual++; }
  });
  return {totalPoints: totalPoints, earned: earned, correct: correct, incorrect: incorrect, manual: manual, blank: blank, total: items.length};
}

function updateScore(dayN) {
  var s = getDayScore(dayN);
  var html =
    '<div class="score-big">' + s.earned.toFixed(2) + ' / ' + s.totalPoints.toFixed(1) + ' điểm</div>' +
    '<div class="score-detail">' +
      '✓ Đúng: <b>' + s.correct + '</b> · ' +
      '✗ Sai: <b>' + s.incorrect + '</b> · ' +
      '? Tự đánh giá: <b>' + s.manual + '</b> · ' +
      '○ Chưa làm: <b>' + s.blank + '</b> / ' + s.total +
    '</div>';
  var top = document.getElementById('score-display-'+dayN);
  if (top) top.innerHTML = html;
  var end = document.getElementById('score-final-'+dayN);
  if (end) end.innerHTML = html;
}

function saveResult(dayN) {
  var s = getDayScore(dayN);
  var data = getDayData(dayN);
  if (!data.history) data.history = [];
  data.history.unshift({
    date: new Date().toLocaleString('vi-VN').replace(/:\d+\s/, ' '),
    score: s.earned, total: s.totalPoints,
    correct: s.correct, incorrect: s.incorrect, manual: s.manual, blank: s.blank
  });
  if (data.history.length > 10) data.history = data.history.slice(0, 10);
  saveDayData(dayN, data);
  alert('💾 Đã lưu Ngày ' + dayN + ': ' + s.earned.toFixed(2) + '/' + s.totalPoints.toFixed(1) + ' điểm');
  renderDay(dayN);
}

function resetDay(dayN) {
  if (!confirm('Bạn có chắc muốn LÀM LẠI Ngày ' + dayN + '?\n\nĐáp án hiện tại sẽ bị xoá nhưng lịch sử điểm vẫn được giữ.')) return;
  var data = getDayData(dayN);
  data.answers = {};
  saveDayData(dayN, data);
  renderDay(dayN);
}

function clearHistory(dayN) {
  if (!confirm('Xoá toàn bộ LỊCH SỬ điểm của Ngày ' + dayN + '?')) return;
  var data = getDayData(dayN);
  data.history = [];
  saveDayData(dayN, data);
  renderDay(dayN);
}

/* ===== RENDER DAY ===== */
function renderDay(n) {
  var d = DAYS[n-1], C = document.getElementById('content');
  var data = getDayData(n);
  var savedAnswers = data.answers || {};

  var html = '<span class="badge t-'+d.type+'">'+TYPENAME[d.type]+'</span>';
  html += '<h2>'+d.title+'</h2><div class="meta">⏱️ '+d.time+'</div>';
  html += '<div class="focus">'+d.focus+'</div>';

  if(d.items && d.items.length > 0) {
    // Top score panel
    html += '<div class="score-panel"><div id="score-display-'+n+'">Chưa làm câu nào</div></div>';

    // Action buttons
    html += '<div style="margin-bottom:16px">';
    html += '<button class="reveal-all-btn" onclick="revealAll('+n+')">⚡ Hiện tất cả đáp án</button>';
    html += '<button class="reveal-all-btn" onclick="hideAll('+n+')">🙈 Ẩn tất cả</button>';
    html += '<button class="reveal-all-btn" style="background:#fee2e2;color:#991b1b;border-color:#fca5a5" onclick="resetDay('+n+')">🔄 Làm lại ngày này</button>';
    html += '</div>';

    // Items
    d.items.forEach(function(item){ html += itemHTML(item, n, savedAnswers); });

    // End-of-day score
    html += '<div class="score-panel" style="margin-top:30px"><div id="score-final-'+n+'"></div>';
    html += '<button class="score-btn" onclick="saveResult('+n+')">💾 Lưu kết quả vào lịch sử</button>';
    html += '<button class="score-btn reset-btn" onclick="resetDay('+n+')">🔄 Làm lại ngày này</button>';
    html += '</div>';

    // History
    if (data.history && data.history.length > 0) {
      html += '<div class="history"><h4>📊 Lịch sử làm bài Ngày ' + n + '</h4>';
      data.history.forEach(function(h, idx){
        html += '<div class="h-row"><span>Lần ' + (idx+1) + ' — ' + h.date + '</span>' +
                '<span><b>' + (h.score||0).toFixed(2) + '/' + (h.total||0).toFixed(1) + '</b> · ' +
                '✓' + h.correct + ' ✗' + h.incorrect + ' ?' + h.manual + ' ○' + h.blank + '</span></div>';
      });
      html += '<button class="mini-btn" onclick="clearHistory('+n+')" style="margin-top:8px">🗑️ Xoá lịch sử</button>';
      html += '</div>';
    }
  } else if(d.n !== 1) {
    html += '<div class="instruction">⚠️ Dữ liệu ngày này chưa nạp.</div>';
  }

  html += '<div class="ud">';
  html += '<button '+(n<=1?'disabled':'')+' onclick="show('+(n-1)+')">← Ngày '+(n-1)+'</button>';
  html += '<button '+(n>=10?'disabled':'')+' onclick="show('+(n+1)+')">Ngày '+(n+1)+' →</button>';
  html += '</div>';

  C.innerHTML = html;
  setActive('d'+n);
  window.scrollTo({top:0, behavior:'smooth'});
  updateScore(n);

  // Update word counts for any writing already answered
  if (d.items) {
    d.items.forEach(function(item){
      if (item.kind === 'q' && savedAnswers[item.num] && savedAnswers[item.num].input) {
        var qid = 'q-d'+n+'-'+item.num;
        var wcEl = document.getElementById('wc-'+qid);
        if (wcEl) updateWordCount('ans-'+qid, 'wc-'+qid);
      }
    });
  }
}

function revealAll(n) {
  DAYS[n-1].items.forEach(function(it){
    if(it.kind==='q') { var p=document.getElementById('q-d'+n+'-'+it.num); if(p) p.classList.add('show'); }
  });
}
function hideAll(n) {
  DAYS[n-1].items.forEach(function(it){
    if(it.kind==='q') { var p=document.getElementById('q-d'+n+'-'+it.num); if(p) p.classList.remove('show'); }
  });
}

function show(x){ renderDay(x); }

function setActive(key){
  var all=document.querySelectorAll('.pill'); for(var i=0;i<all.length;i++) all[i].classList.remove('active');
  var el=document.querySelector('.pill[data-key="'+key+'"]'); if(el) el.classList.add('active');
}

function buildNav(){
  function mk(n){ var d=DAYS[n-1], p=document.createElement('div');
    p.className='pill'; p.setAttribute('data-key','d'+n);
    p.innerHTML='<div class="pd">Ngày '+n+'</div><div class="pt">'+(d.title.split('—')[1]||d.title).trim().substring(0,15)+'</div>';
    p.onclick=function(){show(n);}; return p; }
  var w1=document.getElementById('phase1'), w2=document.getElementById('phase2');
  for(var n=1;n<=5;n++) w1.appendChild(mk(n));
  for(var n2=6;n2<=10;n2++) w2.appendChild(mk(n2));
}

buildNav();
renderDay(1);
</script>
